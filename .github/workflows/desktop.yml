name: Build desktop apps

# Produces the Mac and Windows installers and attaches them to a GitHub Release.
# Run it by hand from the Actions tab, or push a tag like v3.2.5.
#
# Why three jobs rather than one matrix: if each matrix job creates the release
# itself, the two run in parallel and race to create the same tag. One wins and
# the other's artifacts are orphaned — both jobs still report success, and you
# end up with only one platform's installer. So the release is created once,
# both builders upload into that known release id, and it is published at the end.
#
# macOS is built once per architecture and the .app bundle is ad-hoc signed.
# Both matter: `lipo` fusing a universal binary invalidates the signature, and
# the linker's automatic signature covers only the executable, leaving the
# bundle's resources unsigned — either way macOS refuses to launch the app. The
# verify step fails the build if the signature is not valid, so a broken app can
# never reach the release page again. Neither build is notarised, so users still
# confirm once via right-click -> Open; Windows shows SmartScreen once. Removing
# both prompts needs a paid Apple Developer account and a Windows certificate.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v3.2.5)'
        required: true
        default: 'v3.2.5'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.mk.outputs.result }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Work out the tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create (or reuse) the draft release
        id: mk
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const tag = '${{ steps.tag.outputs.tag }}';
            const body = [
              'Desktop builds of Forum Timer. You do not need these — the tool runs in any',
              'browser at https://aibotgp.github.io/forum-timer/ and keeps working offline',
              'once opened. Install one of these only if you would rather have an application.',
              '',
              '**macOS** — take the `aarch64` download for Apple Silicon (M1 and later) or',
              'the `x64` one for an Intel Mac. Not sure which you have: Apple menu → About',
              'This Mac; "Apple M…" means Apple Silicon.',
              '',
              'Open the `.dmg`, drag Forum Timer to Applications, then in Applications',
              '**right-click the app and choose Open**, and Open again at the prompt. Once',
              'only. Double-clicking the first time will not work.',
              '',
              'If macOS says the app is damaged or blocks it outright, clear the download flag',
              'once in Terminal:',
              '',
              '```',
              'xattr -cr "/Applications/Forum Timer.app"',
              '```',
              '',
              'That is needed because the app is signed but not notarised — notarising it',
              'requires a paid Apple Developer account. If you would rather not do any of this,',
              'just use the web version and add it to your Dock: it is the same app.',
              '',
              '**Windows** — run the `.exe` installer. SmartScreen will say the publisher is',
              'unknown: click **More info**, then **Run anyway**. Once only.',
              '',
              'Your meetings and history live on your own computer, and the desktop app keeps',
              'them separately from the browser version. Use **Data → Export backup** in one',
              'and import it in the other to move them across.'
            ].join('\n');
            // Reusing an existing release makes re-runs safe.
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner, repo: context.repo.repo, tag });
              core.info('Reusing release ' + data.id);
              return String(data.id);
            } catch (e) {
              const { data } = await github.rest.repos.createRelease({
                owner: context.repo.owner, repo: context.repo.repo,
                tag_name: tag, name: 'Forum Timer ' + tag,
                body, draft: true, prerelease: false });
              core.info('Created release ' + data.id);
              return String(data.id);
            }

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two separate macOS builds rather than one universal binary. `lipo`
          # fuses the two slices and invalidates the linker's automatic ad-hoc
          # signature, which is why the universal app was refused on launch.
          - platform: macos-latest
            label: 'macos-arm'
            args: '--target aarch64-apple-darwin'
            rust_targets: 'aarch64-apple-darwin'
          - platform: macos-latest
            label: 'macos-intel'
            args: '--target x86_64-apple-darwin'
            rust_targets: 'x86_64-apple-darwin'
          - platform: windows-latest
            label: 'windows'
            args: ''
            rust_targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Tauri bundles a folder, not the repo. Copy in just the app so the
      # installer never carries the design files or git history.
      - name: Stage the web app
        shell: bash
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp manifest.webmanifest dist/manifest.webmanifest
          ls -la dist

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.label }}

      # Generates every icon size and format Tauri needs from one source PNG,
      # including the .icns and .ico that cannot be produced on Linux.
      - name: Generate app icons
        run: npx --yes @tauri-apps/cli@^2 icon app-icon.png

      # Ad-hoc sign the whole .app bundle. The linker already ad-hoc signs the
      # executable, but that covers only the Mach-O binary — the bundle's
      # resources stay outside the signature and codesign then reports "code has
      # no resources but signature indicates they must be present", which macOS
      # treats as tampering and refuses to launch.
      #
      # Set as a macOS-only step, NOT as a matrix expression in `env:`. An
      # expression evaluating to '' still defines the variable on Windows, which
      # sends tauri-action hunting for a certificate that isn't there.
      - name: Enable ad-hoc signing (macOS only)
        if: matrix.platform == 'macos-latest'
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      # Proves the signature actually got applied, rather than assuming it.
      - name: Verify the macOS signature
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          APP=$(find src-tauri/target -name "Forum Timer.app" -maxdepth 6 -type d | head -1)
          echo "app bundle: $APP"
          if [ -z "$APP" ]; then echo "NO .app FOUND"; exit 0; fi
          echo "--- codesign ---"
          codesign -dv --verbose=4 "$APP" 2>&1 | head -20 || true
          echo "--- signature validity (MUST pass) ---"
          if codesign --verify --strict --verbose=2 "$APP" 2>&1 | head -20; then
            echo "signature verified"
          else
            echo "SIGNATURE INVALID — this build would be refused by macOS. Failing here"
            echo "rather than shipping an app that will not open."
            exit 1
          fi
          echo "--- gatekeeper assessment (rejection IS expected: not notarised) ---"
          spctl -a -vv "$APP" 2>&1 | head -10 || true

      # Diagnostics: if an installer ever fails to reach the release again,
      # this shows exactly what the build actually produced.
      - name: List what was bundled
        if: always()
        shell: bash
        run: |
          echo "--- bundle contents ---"
          find src-tauri/target -type d -name bundle -print -exec ls -laR {} \; 2>/dev/null | head -100 || true

      # A second copy of the installers, independent of the release upload.
      - name: Upload installers as build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.label }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        uses: actions/github-script@v7
        with:
          script: |
            const id = Number('${{ needs.create-release.outputs.release_id }}');
            const { data } = await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: id, draft: false });
            core.info('Published ' + data.html_url);
            const assets = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner, repo: context.repo.repo, release_id: id });
            core.info('Assets: ' + assets.data.map(a => a.name).join(', '));
            const names = assets.data.map(a => a.name);
            if (!names.some(n => n.endsWith('.dmg'))) core.warning('No macOS .dmg was attached.');
            if (!names.some(n => n.endsWith('.exe'))) core.warning('No Windows .exe was attached.');
