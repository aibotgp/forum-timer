<style>
  :root {
    --bg: #14161a;
    --fg: #f2f4f7;
    --muted: #8a93a2;
    --line: rgba(255,255,255,0.12);
    --track: rgba(255,255,255,0.08);
    --accent: #3ecf7a;         /* running (green)     */
    --accent-warn: #f4b740;    /* pre-warning (amber) */
    --accent-over: #ff4d4d;    /* overrun (red)       */
    --field: var(--bg);
    --bar: var(--accent);
    --ink: var(--fg);
    --t: 240ms ease;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "Helvetica Neue", Arial, sans-serif;
    background: var(--field);
    color: var(--ink);
    transition: background-color var(--t), color var(--t);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  body[data-phase="idle"]    { --field:#14161a; --bar:var(--muted);       --ink:#f2f4f7; }
  body[data-phase="running"] { --field:#0e1a12; --bar:var(--accent);      --ink:#eafff1; }
  body[data-phase="prewarn"] { --field:#201a0a; --bar:var(--accent-warn); --ink:#fff6e2; }
  body[data-phase="overrun"] { --field:#240d0d; --bar:var(--accent-over); --ink:#ffe9e9; }
  body[data-phase="ended"]   { --field:#16181c; --bar:var(--muted);       --ink:#c7cdd6; }
  body[data-paused="true"]   { --field:#0f1114; --ink:#aab2bf; }
  body.managing { overflow: auto; }

  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid #7db4ff; outline-offset: 3px; border-radius: 10px; }

  /* ===================== RUN VIEW ===================== */
  #runView { height: 100%; display: flex; flex-direction: column; padding: clamp(14px,2.6vw,36px); }
  .run-top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .crumbs { font-size: clamp(13px,1.7vw,20px); color: var(--muted); font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumbs b { color: var(--ink); opacity: 0.9; }
  .status { font-size: clamp(13px,1.6vw,20px); font-weight: 800; text-transform: uppercase;
            letter-spacing: 2px; color: var(--bar); white-space: nowrap; }

  .label { font-size: clamp(22px,4.4vw,50px); font-weight: 700; letter-spacing: .5px;
           text-align: center; margin-top: 6px; color: var(--ink); opacity: .95;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .clock-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .clock { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
           font-weight: 800; line-height: .9; letter-spacing: -.02em; color: var(--ink);
           font-size: min(30vw, 30vh); text-align: center; transition: color var(--t); }
  .clock .sign { font-weight: 700; }
  body[data-phase="overrun"] .clock { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.72;} }

  /* renderer mount */
  #viz { margin: clamp(8px,1.8vh,20px) 0; }
  .bar-track { height: clamp(20px,3.6vh,50px); background: var(--track); border-radius: 6px;
               overflow: hidden; position: relative; }
  .bar-fill { position: absolute; inset: 0; background: var(--bar); transform-origin: right center;
              transform: scaleX(1); transition: transform 120ms linear, background-color var(--t); }
  .ring-wrap { display: flex; justify-content: center; }
  .ring-wrap svg { width: clamp(120px,20vh,220px); height: clamp(120px,20vh,220px); }
  .ring-bg { fill: none; stroke: var(--track); }
  .ring-fg { fill: none; stroke: var(--bar); stroke-linecap: round;
             transition: stroke-dashoffset 120ms linear, stroke var(--t);
             transform: rotate(-90deg); transform-origin: 50% 50%; }

  .run-meta { display: flex; justify-content: center; gap: clamp(14px,3vw,40px); flex-wrap: wrap;
              color: var(--muted); font-size: clamp(12px,1.5vw,17px); margin-bottom: 10px; }
  .run-meta .m b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .run-meta .over b { color: var(--accent-over); }

  .transport { display: flex; gap: clamp(8px,1.4vw,15px); justify-content: center; flex-wrap: wrap; }
  button.ctl { font-weight: 650; font-size: clamp(15px,1.9vw,22px); color: var(--fg);
    background: rgba(255,255,255,.07); border: 1.5px solid rgba(255,255,255,.16); border-radius: 12px;
    padding: clamp(9px,1.5vh,17px) clamp(16px,2.6vw,30px); min-width: clamp(90px,10vw,140px);
    transition: background-color 120ms ease, transform 60ms ease; }
  button.ctl:hover { background: rgba(255,255,255,.13); }
  button.ctl:active { transform: translateY(1px); }
  button.ctl.primary { background: var(--bar); color: #0b0d10; border-color: transparent; }
  button.ctl:disabled { opacity: .34; cursor: default; }
  button.ctl .key { font-size: .62em; opacity: .6; margin-left: 8px; font-weight: 600; }

  .hintbar { text-align: center; color: var(--muted); font-size: clamp(11px,1.3vw,14px); margin-top: 10px; }
  .hintbar kbd { background: rgba(255,255,255,.09); border-radius: 5px; padding: 1px 6px; margin: 0 1px; }

  /* reset the inherited hero-numeral typography inside the run empty state */
  .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 14px; text-align: center; color: var(--muted);
           font-size: 15.5px; font-weight: 500; letter-spacing: normal; line-height: 1.5; }
  .empty h1 { color: var(--fg); font-size: clamp(24px,4vw,40px); margin: 0; letter-spacing: -.01em; }
  .empty p { margin: 0; max-width: 46ch; }
  .empty .acts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  /* ===================== MANAGE VIEW ===================== */
  #manageView { display: none; max-width: 960px; margin: 0 auto; padding: clamp(16px,3vw,40px); }
  body.managing #runView { display: none; }
  body.managing #manageView { display: block; }

  /* ===================== SUMMARY VIEW ===================== */
  #summaryView { display: none; max-width: 960px; margin: 0 auto; padding: clamp(16px,3vw,40px); }
  body.summarizing { overflow: auto; }
  body.summarizing #runView, body.summarizing #manageView { display: none; }
  body.summarizing #summaryView { display: block; }
  .done-head { text-align: center; margin-bottom: 26px; }
  .done-head .kicker { color: var(--accent); font-weight: 800; text-transform: uppercase;
                       letter-spacing: 2.5px; font-size: 14px; }
  .done-head h1 { margin: 8px 0 4px; font-size: clamp(28px,5vw,44px); }
  .done-head .sub { color: var(--muted); font-size: 15px; }
  .done-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 24px 0 30px; }
  .sess-block { margin-bottom: 10px; }
  .sess-block .sess-top { display: flex; align-items: baseline; justify-content: space-between;
                          gap: 12px; flex-wrap: wrap; }
  .sess-block .sess-nm { font-weight: 700; font-size: 17px; }
  .sess-block .sess-meta { color: var(--muted); font-size: 13px; }
  .m-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 12px; }
  .m-head h1 { margin: 0; font-size: 26px; }
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 22px; flex-wrap: wrap; }
  .tab { background: none; border: none; color: var(--muted); font-weight: 650; font-size: 15px;
         padding: 10px 14px; border-bottom: 2.5px solid transparent; }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); }
  .panel-sec { display: none; }
  .panel-sec.active { display: block; }

  .card { background: #1b1e24; border: 1px solid var(--line); border-radius: 14px;

</style>

<body data-phase="idle" data-paused="false">

<script>
"use strict";
/* =========================================================================
   Forum Timer — Build 1
   Timer library · sessions with buffer pools · meetings · localStorage
   persistence · history + drift roll-up (timer/session/meeting) ·
   per-run paused-time rolled up to meeting · full CRUD ·
   swappable time-remaining renderer.
   Time is always computed from Date.now() timestamps, never tick-counted.
   ========================================================================= */

// ---------- utils ----------
const $ = (id) => document.getElementById(id);
const uid = () => "id" + Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

function fmt(ms) {                 // mm:ss (or h:mm:ss beyond an hour)
  const neg = ms < 0; ms = Math.abs(ms);
  const total = Math.floor(ms/1000);
  const h = Math.floor(total/3600), m = Math.floor((total%3600)/60), s = total%60;
  const core = h > 0
    ? h + ":" + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0")
    : String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
  return (neg ? "-" : "") + core;
}
function fmtSigned(ms) { return (ms > 0 ? "+" : ms < 0 ? "−" : "") + fmt(Math.abs(ms)); }

const APP_VERSION = "2.0.0";

// ---------- toast ----------
let toastTimer = null;
function toast(msg, opts) {
  opts = opts || {};
  const t = $("toast");
  t.className = "toast" + (opts.warn ? " warn" : "");
  t.innerHTML = "<span>" + esc(msg) + "</span>";
  if (opts.actionLabel) {
    const b = document.createElement("button");
    b.textContent = opts.actionLabel;
    b.onclick = () => { hideToast(); if (opts.onAction) opts.onAction(); };
    t.append(b);
  }
  requestAnimationFrame(() => t.classList.add("show"));
  clearTimeout(toastTimer);
  if (!opts.sticky) toastTimer = setTimeout(hideToast, opts.ms || 3200);
}
function hideToast() { clearTimeout(toastTimer); $("toast").classList.remove("show"); }

// ---------- empty-state helper ----------
function blank(icon, title, body, actions) {
  return '<div class="blank"><div class="icon">' + icon + '</div>' +
    '<h3>' + esc(title) + '</h3><p>' + body + '</p>' +
    '<div class="acts">' + (actions || "") + '</div></div>';
}

// ---------- file download ----------
function downloadFile(name, text, mime) {
  const blob = new Blob([text], { type: (mime || "text/plain") + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.rel = "noopener";
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function stamp() {
  const d = new Date(), p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes());
}

// ---------- sound ----------
const SOUNDS = { none:"None", soft:"Soft", beep:"Beep", chime:"Chime", bell:"Bell", alarm:"Alarm", buzz:"Buzz" };
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; audioCtx = new AC(); }
  if (audioCtx.state === "suspended") audioCtx.resume();
}
function tone(freq, off, dur, type, peak) {
  const t0 = audioCtx.currentTime + off, osc = audioCtx.createOscillator(), g = audioCtx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(audioCtx.destination); osc.start(t0); osc.stop(t0 + dur + 0.02);
}
function playSound(id) {
  if (!id || id === "none") return; ensureAudio(); if (!audioCtx) return;
  switch (id) {
    case "soft":  tone(523.25,0,.45,"sine",.28); break;
    case "beep":  tone(880,0,.16,"square",.22); break;
    case "chime": tone(659.25,0,.28,"sine",.3); tone(987.77,.16,.42,"sine",.28); break;
    case "bell":  tone(784,0,.9,"triangle",.32); tone(1568,0,.5,"sine",.12); break;
    case "alarm": tone(1150,0,.12,"square",.28); tone(1150,.2,.12,"square",.28); tone(1150,.4,.12,"square",.28); break;
    case "buzz":  tone(150,0,.55,"sawtooth",.24); break;
  }
}

// ---------- persistence ----------
const STORE_KEY = "forumTimer.v1";
let store = null;

function newTimer(label, min, sec) {
  return { id: uid(), label: label || "Timer", durationMs: ((min||0)*60 + (sec||0))*1000,
           preWarn: { n: 30, sound: "chime" }, timeUp: { sound: "bell" }, overrun: { n: 15, sound: "alarm" } };
}
function cloneTimer(t) {
  return { id: uid(), label: t.label, durationMs: t.durationMs,
           preWarn: { ...t.preWarn }, timeUp: { ...t.timeUp }, overrun: { ...t.overrun } };
}
function newSession(title) {
  return { id: uid(), title: title || "Session", plannedMs: 0, bufferBeforeMs: 0, bufferAfterMs: 0, timers: [] };
}
function newMeeting(title) {
  return { id: uid(), title: title || "Meeting", targetTotalMs: 0, pausedTotalMs: 0, sessions: [] };
}

function seed() {
  const lib = [
    newTimer("Check-in", 3, 0),
    newTimer("Presentation", 10, 0),
    newTimer("Q&A / Feedback", 12, 0),
    newTimer("Business Housekeeping", 8, 0),
  ];
  const m = newMeeting("EO Forum — Monthly");
  m.targetTotalMs = 180*60*1000;
  const s1 = newSession("Opening & Check-ins");
  s1.bufferAfterMs = 5*60*1000;
  s1.timers = [cloneTimer(lib[0]), cloneTimer(lib[0]), cloneTimer(lib[0])];
  s1.timers[0].label = "Check-in — A"; s1.timers[1].label = "Check-in — B"; s1.timers[2].label = "Check-in — C";
  const s2 = newSession("Member Presentation");
  s2.bufferBeforeMs = 2*60*1000; s2.bufferAfterMs = 5*60*1000;
  s2.timers = [cloneTimer(lib[1]), cloneTimer(lib[2])];
  const s3 = newSession("Business & Close");
  s3.bufferAfterMs = 3*60*1000;
  s3.timers = [cloneTimer(lib[3])];
  m.sessions = [s1, s2, s3];
  recomputeSessionPlanned(s1); recomputeSessionPlanned(s2); recomputeSessionPlanned(s3);
  return { version: 1, library: lib, meetings: [m], history: [],
           settings: { rendererId: "bar", activeMeetingId: m.id } };
}
function load() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) { store = JSON.parse(raw); return; } }
  catch (e) { /* fall through to seed */ }
  store = seed(); save();
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {} }

function recomputeSessionPlanned(s) { s.plannedMs = s.timers.reduce((a,t)=>a+t.durationMs, 0); }

// ==========================================================================
//  EXPORT / IMPORT
//  localStorage does not travel between devices or browsers, so the JSON file
//  is the backup and the transfer format. CSV is for analysis elsewhere.
// ==========================================================================
function exportJSON() {
  const payload = {
    app: "forum-timer", schema: 1, appVersion: APP_VERSION,
    exportedAt: new Date().toISOString(),
    library: store.library, meetings: store.meetings,
    history: store.history, settings: store.settings,
  };
  downloadFile("forum-timer-" + stamp() + ".json", JSON.stringify(payload, null, 2), "application/json");
  toast("Backup exported.");
}

function csvCell(v) {
  const s = String(v == null ? "" : v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportCSV() {
  if (!store.history.length) { toast("No history to export yet.", { warn: true }); return; }
  const secs = (ms) => (ms/1000).toFixed(1);
  const head = ["date","meeting","session","timer","planned_s","actual_s","variance_s","paused_s"];
  const rows = store.history.map(r => [
    new Date(r.date).toISOString(), r.meetingTitle, r.sessionTitle, r.timerLabel,
    secs(r.plannedMs), secs(r.actualMs), secs(r.varianceMs), secs(r.pausedMs || 0),
  ]);
  const csv = [head, ...rows].map(r => r.map(csvCell).join(",")).join("\r\n") + "\r\n";
  downloadFile("forum-timer-history-" + stamp() + ".csv", csv, "text/csv");
  toast("History exported as CSV.");
}

function validateImport(obj) {
  if (!obj || typeof obj !== "object") return "That file is not valid JSON.";
  if (obj.app && obj.app !== "forum-timer") return "That backup is from a different app.";
  const arrays = ["library","meetings","history"];
  for (const k of arrays) if (obj[k] != null && !Array.isArray(obj[k])) return "Backup field '" + k + "' is malformed.";
  if (!obj.library && !obj.meetings && !obj.history) return "No timers, meetings or history found in that file.";
  return null;
}

function applyImport(obj, mode) {
  const inc = {
    library: Array.isArray(obj.library) ? obj.library : [],
    meetings: Array.isArray(obj.meetings) ? obj.meetings : [],
    history: Array.isArray(obj.history) ? obj.history : [],
  };
  if (mode === "replace") {
    store.library = inc.library; store.meetings = inc.meetings; store.history = inc.history;
    if (obj.settings && typeof obj.settings === "object") {
      store.settings.rendererId = (obj.settings.rendererId in Renderers) ? obj.settings.rendererId : store.settings.rendererId;
      store.settings.activeMeetingId = obj.settings.activeMeetingId || null;
    }
  } else {
    // merge: keep everything existing; add incoming, re-id anything that collides
    const libIds = new Set(store.library.map(x => x.id));
    inc.library.forEach(t => { const c = JSON.parse(JSON.stringify(t)); if (libIds.has(c.id)) c.id = uid(); store.library.push(c); });
    const mIds = new Set(store.meetings.map(x => x.id));
    inc.meetings.forEach(m => { const c = JSON.parse(JSON.stringify(m)); if (mIds.has(c.id)) reid(c); store.meetings.push(c); });
    const hIds = new Set(store.history.map(x => x.id));
    inc.history.forEach(r => { if (!hIds.has(r.id)) store.history.push(r); });   // dedupe by id
  }
  // repair derived fields and guarantee the shape the app expects
  store.meetings.forEach(m => {
    m.pausedTotalMs = m.pausedTotalMs || 0;
    m.sessions = Array.isArray(m.sessions) ? m.sessions : [];
    m.sessions.forEach(s => { s.timers = Array.isArray(s.timers) ? s.timers : []; recomputeSessionPlanned(s); });
  });
  store.history.sort((a,b) => new Date(a.date) - new Date(b.date));
  save();
  loadMeetingIntoRun(activeMeeting(), false);
  mountRenderer();
  const n = inc.meetings.length + inc.library.length + inc.history.length;
  toast((mode === "replace" ? "Replaced with " : "Merged in ") + n + " records.");
  renderManage();
}

function handleImportFile(file) {
  const rd = new FileReader();
  rd.onerror = () => toast("Could not read that file.", { warn: true });
  rd.onload = () => {
    let obj = null;
    try { obj = JSON.parse(rd.result); }
    catch (e) { toast("That file is not valid JSON.", { warn: true }); return; }
    const err = validateImport(obj);
    if (err) { toast(err, { warn: true }); return; }
    const counts = ((obj.meetings||[]).length) + " meetings, " + ((obj.library||[]).length) +
                   " library timers, " + ((obj.history||[]).length) + " history rows";
    openModal('<h2>Import backup</h2><p class="hint">Found ' + esc(counts) + '.</p>' +
      '<p class="hint"><b>Merge</b> keeps what you have and adds the incoming records. ' +
      '<b>Replace</b> discards everything currently in this browser.</p>' +
      '<div class="modal-actions"><button class="btn ghost" data-act="closeModal">Cancel</button>' +
      '<button class="btn" id="imp_merge">Merge</button>' +
      '<button class="btn primary" id="imp_replace">Replace all</button></div>');
    $("imp_merge").onclick = () => { closeModal(); applyImport(obj, "merge"); };
    $("imp_replace").onclick = () => {
      if (confirm("Replace ALL meetings, timers and history in this browser?")) { closeModal(); applyImport(obj, "replace"); }
    };
  };
  rd.readAsText(file);
}

// lookups
const findMeeting = (id) => store.meetings.find(m => m.id === id);
function activeMeeting() {
  let m = findMeeting(store.settings.activeMeetingId);
  if (!m) m = store.meetings[0] || null;
  return m;
}

// ==========================================================================
//  RUN ENGINE
// ==========================================================================
const run = {
  steps: [],          // [{session, timer}]
  index: 0,
  state: "idle",      // idle | running | paused | ended
  startEpoch: 0,
  elapsedBeforePause: 0,
  pausedAccumMs: 0,   // paused wall-time for the CURRENT timer
  pauseStartEpoch: 0,
  preWarnFired: false, timeUpFired: false, overrunBeeps: 0,
  sessionUsed: {},    // sessionId -> overrun ms consumed by COMPLETED timers this run
  recorded: false,
  records: [],        // run records produced by THIS pass through the meeting
};

function buildSteps(m) {
  run.steps = [];
  if (m) m.sessions.forEach(s => s.timers.forEach(t => run.steps.push({ session: s, timer: t })));
}
function loadMeetingIntoRun(m, goRun) {
  store.settings.activeMeetingId = m ? m.id : null; save();
  buildSteps(m);
  run.index = 0; run.sessionUsed = {}; run.records = [];
  resetTimer();
  if (goRun) showRun();
  renderRun();
}
function curStep() { return run.steps[run.index] || null; }
function curTimer() { const s = curStep(); return s ? s.timer : null; }
function curSession() { const s = curStep(); return s ? s.session : null; }

function elapsedMs() {
  if (run.state === "running") return run.elapsedBeforePause + (Date.now() - run.startEpoch);
  return run.elapsedBeforePause;
}

function resetTimer() {
  run.state = "idle"; run.elapsedBeforePause = 0; run.pausedAccumMs = 0;
  run.preWarnFired = false; run.timeUpFired = false; run.overrunBeeps = 0; run.recorded = false;
}

function startTimer() {
  ensureAudio();
  const t = curTimer(); if (!t) return;
  if (run.state === "running") return;
  if (run.state === "idle" || run.state === "ended") {
    run.elapsedBeforePause = 0; run.pausedAccumMs = 0;
    run.preWarnFired = false; run.timeUpFired = false; run.overrunBeeps = 0; run.recorded = false;
  } else if (run.state === "paused") {
    run.pausedAccumMs += Date.now() - run.pauseStartEpoch;   // close the pause window
  }
  run.startEpoch = Date.now(); run.state = "running"; renderRun();
}
function pauseTimer() {
  if (run.state !== "running") return;
  run.elapsedBeforePause += Date.now() - run.startEpoch;
  run.pauseStartEpoch = Date.now(); run.state = "paused"; renderRun();
}
function toggleStartPause() { if (run.state === "running") pauseTimer(); else startTimer(); }

function recordRun() {
  const step = curStep(); if (!step || run.recorded) return;
  const t = step.timer, s = step.session;
  const actual = elapsedMs();
  const variance = actual - t.durationMs;
  const rec = { id: uid(), date: new Date().toISOString(),
    meetingId: (activeMeeting()||{}).id || null, meetingTitle: (activeMeeting()||{}).title || "(ad-hoc)",
    sessionId: s.id, sessionTitle: s.title, timerId: t.id, timerLabel: t.label,
    plannedMs: t.durationMs, actualMs: actual, varianceMs: variance, pausedMs: run.pausedAccumMs };
  store.history.push(rec);
  run.records.push(rec);
  // roll paused time up to the meeting
  const m = activeMeeting(); if (m) m.pausedTotalMs = (m.pausedTotalMs||0) + run.pausedAccumMs;
  // draw down this session's buffer with any positive overrun
  run.sessionUsed[s.id] = (run.sessionUsed[s.id]||0) + Math.max(0, variance);
  run.recorded = true; save();
}

// Close the open segment and leave the clock in a stable, non-running state.
// This must happen BEFORE recordRun(), otherwise elapsedMs() adds the current
// segment a second time and every recorded duration is inflated.
function settle() {
  if (run.state === "running") {
    run.elapsedBeforePause += Date.now() - run.startEpoch;
  } else if (run.state === "paused") {
    run.pausedAccumMs += Date.now() - run.pauseStartEpoch;
  }
  run.state = "settled";                    // neither running nor paused
}

function endTimer() {                       // hold on the ended timer (no advance)
  if (run.state === "idle") return;
  settle(); recordRun(); run.state = "ended"; renderRun();
}

function isLastStep() { return run.index >= run.steps.length - 1; }

function nextTimer() {                       // record current, advance to next step
  if (!curStep()) return;
  const wasIdle = (run.state === "idle");
  settle();
  if (!wasIdle) recordRun();
  if (!isLastStep()) { run.index++; resetTimer(); renderRun(); }
  else { run.state = "ended"; showSummary(); }   // meeting finished → summary
}

// alerts (only while actively running)
function checkAlerts(elapsed) {
  const t = curTimer(); if (!t || run.state !== "running") return;
  const remaining = t.durationMs - elapsed;
  if (!run.preWarnFired && remaining <= t.preWarn.n*1000) { run.preWarnFired = true; playSound(t.preWarn.sound); }
  if (!run.timeUpFired && elapsed >= t.durationMs) { run.timeUpFired = true; playSound(t.timeUp.sound); }
  if (elapsed > t.durationMs) {
    const due = Math.floor((elapsed - t.durationMs) / (t.overrun.n*1000));
    if (due > run.overrunBeeps) { run.overrunBeeps = due; playSound(t.overrun.sound); }
  }
}

// ==========================================================================
//  RENDERERS (swappable)
//  Each: mount(container) builds DOM once; update(container, state) draws.
//  state = { phase, fraction (0..1 remaining), overrunFraction (0..1) }
// ==========================================================================
const Renderers = {
  bar: {
    name: "Depletion bar",
    mount(el) { el.innerHTML = '<div class="bar-track"><div class="bar-fill" id="_barFill"></div></div>'; },
    update(el, st) {
      const f = $("_barFill"); if (!f) return;
      const scale = st.fraction > 0 ? st.fraction : st.overrunFraction;
      f.style.transform = "scaleX(" + clamp(scale,0,1) + ")";
    },
  },
  ring: {
    name: "Draining ring",
    mount(el) {
      el.innerHTML =
        '<div class="ring-wrap"><svg viewBox="0 0 100 100">' +
        '<circle class="ring-bg" cx="50" cy="50" r="42" stroke-width="9"></circle>' +
        '<circle class="ring-fg" id="_ringFg" cx="50" cy="50" r="42" stroke-width="9" ' +
        'stroke-dasharray="263.9" stroke-dashoffset="0"></circle></svg></div>';
    },
    update(el, st) {
      const c = $("_ringFg"); if (!c) return;
      const C = 2 * Math.PI * 42;                 // ≈263.9
      const frac = st.fraction > 0 ? st.fraction : st.overrunFraction;
      c.setAttribute("stroke-dashoffset", (C * (1 - clamp(frac,0,1))).toFixed(2));
    },
  },
};
let activeRenderer = null;
function mountRenderer() {
  const id = (store.settings.rendererId in Renderers) ? store.settings.rendererId : "bar";
  activeRenderer = Renderers[id];
  activeRenderer.mount($("viz"));
}

// ==========================================================================
//  RUN VIEW RENDER
// ==========================================================================
function phaseFor(remaining) {
  const t = curTimer();
  if (!t || run.state === "idle") return "idle";
  if (run.state === "ended" || run.state === "settled") return "ended";
  if (remaining <= 0) return "overrun";
  if (remaining <= t.preWarn.n*1000) return "prewarn";
  return "running";
}
function statusLabel(phase) {
  if (run.state === "paused") return "Paused";
  return { idle:"Ready", running:"Running", prewarn:"Wrap up", overrun:"Overrun", ended:"Ended" }[phase] || "";
}

function renderRun() {
  const t = curTimer(), s = curSession(), m = activeMeeting();

  if (!t) {   // empty state
    $("runView").querySelector(".run-top").style.visibility = "hidden";
    $("labelText").style.display = "none";
    $("viz").style.display = "none";
    $("runMeta").innerHTML = "";
    const noneAtAll = !store.meetings.length;
    $("clock").innerHTML = '<div class="empty"><h1>' +
      (noneAtAll ? "Nothing to time yet" : "No meeting loaded") + '</h1>' +
      '<p>' + (noneAtAll
        ? "Build a meeting — sessions, then timers inside them — or drop in the sample to see how it fits together."
        : "You have saved meetings. Open Manage and press <b>Load</b> on the one you want to run.") + '</p>' +
      '<div class="acts">' +
        '<button class="btn primary" data-act="doneToMeetings">Open Manage</button>' +
        (noneAtAll ? '<button class="btn" data-act="reseedSample">Add sample meeting</button>' : '') +
      '</div></div>';
    $("btnStart").disabled = true; $("btnReset").disabled = true; $("btnEnd").disabled = true; $("btnNext").disabled = true;
    document.body.dataset.phase = "idle"; document.body.dataset.paused = "false";
    return;
  }
  $("runView").querySelector(".run-top").style.visibility = "visible";
  $("labelText").style.display = ""; $("viz").style.display = "";
  $("btnStart").disabled = false; $("btnNext").disabled = false;

  const elapsed = elapsedMs();
  const remaining = t.durationMs - elapsed;
  const phase = phaseFor(remaining);
  document.body.dataset.phase = phase;
  document.body.dataset.paused = String(run.state === "paused");

  // crumbs + progress
  const sIdx = m ? m.sessions.indexOf(s) : -1;
  const tIdxInS = s.timers.indexOf(t);
  $("crumbs").innerHTML = (m ? "<b>"+esc(m.title)+"</b> · " : "") + esc(s.title) +
    (sIdx>=0 ? " · Session " + (sIdx+1) + "/" + m.sessions.length : "") +
    " · Timer " + (tIdxInS+1) + "/" + s.timers.length;
  $("statusText").textContent = statusLabel(phase);
  $("labelText").textContent = t.label;

  // numerals
  $("clock").innerHTML = remaining >= 0 ? fmt(remaining)
    : '<span class="sign">+</span>' + fmt(-remaining);

  // renderer
  activeRenderer.update($("viz"), {
    phase,
    fraction: remaining > 0 ? clamp(remaining / t.durationMs, 0, 1) : 0,
    overrunFraction: remaining <= 0 ? clamp((-remaining) / t.durationMs, 0, 1) : 0,
  });

  // buffer + paused + drift readouts
  const liveOver = Math.max(0, -remaining);
  const pool = (s.bufferBeforeMs||0) + (s.bufferAfterMs||0);
  const used = (run.sessionUsed[s.id]||0) + liveOver;
  const bufLeft = pool - used;
  const pausedLive = run.pausedAccumMs + (run.state === "paused" ? Date.now() - run.pauseStartEpoch : 0);
  let meta = "";
  meta += '<div class="m">Buffer ' + (bufLeft >= 0
      ? '<b>' + fmt(bufLeft) + ' left</b>'
      : '<span class="over"><b>' + fmtSigned(bufLeft) + ' over</b></span>') + '</div>';
  meta += '<div class="m">Paused <b>' + fmt(pausedLive) + '</b></div>';
  if (elapsed !== t.durationMs) {
    const v = elapsed - t.durationMs;
    meta += '<div class="m ' + (v>0?'over':'') + '">Variance <b>' + fmtSigned(v) + '</b></div>';
  }
  $("runMeta").innerHTML = meta;

  // start/pause label
  $("btnStart").innerHTML =
    (run.state === "running" ? "Pause" : run.state === "paused" ? "Resume" : "Start") +
    '<span class="key">Space</span>';
  $("btnReset").disabled = (run.state === "idle");
  $("btnEnd").disabled = (run.state === "idle" || run.state === "ended");
  // On the final timer, Next finishes the meeting and opens the summary.
  $("btnNext").innerHTML = (isLastStep() ? "Finish ▸" : "Next") + '<span class="key">N</span>';
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// animation loop (display only; math from timestamps)
function loop() {
  if (run.state === "running") { checkAlerts(elapsedMs()); renderRun(); }
  else if (run.state === "paused") { renderRun(); }   // keep paused clock ticking
  requestAnimationFrame(loop);
}

  document.body.classList.remove("managing", "summarizing");
  renderRun();
}

  document.body.classList.remove("summarizing");

// ==========================================================================
//  MEETING SUMMARY (shown when the last timer is finished with Next)
// ==========================================================================
function renderSummary() {
  const m = activeMeeting();
  const recs = run.records;
  const plannedRun = recs.reduce((a,r)=>a+r.plannedMs, 0);
  const actualRun  = recs.reduce((a,r)=>a+r.actualMs, 0);
  const pausedRun  = recs.reduce((a,r)=>a+r.pausedMs, 0);
  const driftRun   = actualRun - plannedRun;
  const plannedAll = m ? m.sessions.reduce((a,s)=>a+s.plannedMs, 0) : 0;
  const ranCount   = recs.length;
  const stepCount  = run.steps.length;

  let h = '<div class="done-head"><div class="kicker">Meeting complete</div>' +
    '<h1>' + esc(m ? m.title : "Meeting") + '</h1>' +
    '<div class="sub">' + ranCount + ' of ' + stepCount + ' timers run' +
    (ranCount < stepCount ? ' · ' + (stepCount - ranCount) + ' skipped' : '') + '</div></div>';

  h += '<div class="done-actions">' +
    '<button class="btn primary" data-act="doneToMeetings">◂ Back to meetings</button>' +
    '<button class="btn" data-act="doneRunAgain">Run again</button>' +
    '<button class="btn ghost" data-act="doneToHistory">View full history</button>' +
    '</div>';

  h += '<div class="stat-tiles">' +
    tile("Target", m ? fmt(m.targetTotalMs) : "—") +
    tile("Planned", fmt(plannedAll)) +
    tile("Actual", fmt(actualRun)) +
    tile("Drift", fmtSigned(driftRun)) +
    tile("Paused", fmt(pausedRun)) + '</div>';

  if (!recs.length) {
    h += '<div class="card"><div class="sub">No timers were run, so there is nothing to report.</div></div>';
    $("summaryView").innerHTML = h;
    return;
  }

  // group this run's records by session, preserving meeting order
  const bySession = {};
  recs.forEach(r => { (bySession[r.sessionId] = bySession[r.sessionId] || []).push(r); });
  const order = m ? m.sessions.filter(s => bySession[s.id]) : [];

  order.forEach(s => {
    const rows = bySession[s.id];
    const act = rows.reduce((a,r)=>a+r.actualMs, 0);
    const pln = rows.reduce((a,r)=>a+r.plannedMs, 0);
    const pau = rows.reduce((a,r)=>a+r.pausedMs, 0);
    const drift = act - pln;
    const pool = (s.bufferBeforeMs||0) + (s.bufferAfterMs||0);
    const used = rows.reduce((a,r)=>a+Math.max(0, r.varianceMs), 0);
    const left = pool - used;

    h += '<div class="card sess-block"><div class="sess-top">' +
      '<div><div class="sess-nm">' + esc(s.title) + '</div>' +
      '<div class="sess-meta">planned ' + fmt(pln) + ' · actual ' + fmt(act) +
      ' · paused ' + fmt(pau) + '</div></div>' +
      '<div class="chips">' +
        '<span class="chip">drift ' + fmtSigned(drift) + '</span>' +
        '<span class="chip">buffer ' + fmt(pool) + '</span>' +
        '<span class="chip">' + (left >= 0 ? fmt(left) + ' left' : fmtSigned(left) + ' over') + '</span>' +
      '</div></div>';

    h += '<table class="stats" style="margin-top:10px"><thead><tr><th>Timer</th>' +
      '<th class="num">Planned</th><th class="num">Actual</th>' +
      '<th class="num">Variance</th><th class="num">Paused</th></tr></thead><tbody>';
    rows.forEach(r => {
      h += '<tr><td>' + esc(r.timerLabel) + '</td>' +
        '<td class="num">' + fmt(r.plannedMs) + '</td>' +
        '<td class="num">' + fmt(r.actualMs) + '</td>' +
        '<td class="num ' + (r.varianceMs>0?'pos':'neg') + '">' + fmtSigned(r.varianceMs) + '</td>' +
        '<td class="num">' + fmt(r.pausedMs) + '</td></tr>';
    });
    h += '</tbody></table></div>';
  });

  h += '<div class="done-actions" style="margin-bottom:8px">' +
    '<button class="btn primary" data-act="doneToMeetings">◂ Back to meetings</button></div>';
  h += '<div class="hintbar"><kbd>N</kbd> or <kbd>Esc</kbd> back to meetings · ' +
       '<kbd>S</kbd> manage</div>';

  $("summaryView").innerHTML = h;
}

    else if (navigator.serviceWorker.controller) el.textContent = "ready — works with no internet";
    else el.textContent = "registered — reload once to activate";
  }).catch(() => { el.textContent = "unavailable"; });
}

    return;
  }
  let h = '<div style="margin-bottom:14px"><button class="btn primary" data-act="newLibTimer">+ New library timer</button></div>';
  store.library.forEach(t => {
    h += '<div class="card"><div class="row1"><div><div class="ttl">'+esc(t.label)+'</div>' +
      '<div class="sub">' + fmt(t.durationMs) + ' · pre ' + t.preWarn.n + 's/' + SOUNDS[t.preWarn.sound] +
      ' · up ' + SOUNDS[t.timeUp.sound] + ' · over ' + t.overrun.n + 's/' + SOUNDS[t.overrun.sound] + '</div></div>' +
      '<div class="list-actions">' +
      '<button class="mini" data-act="editLibTimer" data-id="'+t.id+'">Edit</button>' +
      '<button class="mini" data-act="dupLibTimer" data-id="'+t.id+'">Duplicate</button>' +

      '</div></div></div>';
  });

}

// ---- History tab ----
function renderHistory() {
  const el = $("sec-history");
  const hist = store.history;
  if (!hist.length) {
    el.innerHTML = blank("📈", "No runs recorded yet",
      "Every timer you run writes a row here: planned versus actual, variance, and time spent paused. " +
      "Drift then rolls up by timer label, by session, and by meeting — so you can see whether delays " +
      "come from one person, one kind of session, or the meeting as a whole.",
      '<button class="btn primary" data-act="doneToMeetings">Load a meeting and run it</button>');
    return;
  }
  const totalPaused = store.meetings.reduce((a,m)=>a+(m.pausedTotalMs||0),0);
  const totalVar = hist.reduce((a,r)=>a+r.varianceMs,0);

  let h = '<div class="stat-tiles">' +
    tile("Runs recorded", hist.length) +
    tile("Total drift", fmtSigned(totalVar)) +
    tile("Total paused", fmt(totalPaused)) + '</div>';

  // by timer label
  h += '<h3>Drift by timer label</h3>' + driftTable(groupBy(hist, r => r.timerLabel));
  // by session
  h += '<h3>Drift by session</h3>' + driftTable(groupBy(hist, r => r.sessionTitle));
  // by meeting (+ paused)
  h += '<h3>By meeting</h3>';
  const gm = groupBy(hist, r => r.meetingTitle);
  h += '<table class="stats"><thead><tr><th>Meeting</th><th class="num">Runs</th>' +
       '<th class="num">Total drift</th><th class="num">Avg drift</th><th class="num">Paused</th></tr></thead><tbody>';
  const pausedByMeeting = {}; store.meetings.forEach(m => pausedByMeeting[m.title] = (pausedByMeeting[m.title]||0)+(m.pausedTotalMs||0));
  Object.keys(gm).forEach(k => {
    const rows = gm[k], tot = rows.reduce((a,r)=>a+r.varianceMs,0);
    h += '<tr><td>'+esc(k)+'</td><td class="num">'+rows.length+'</td>' +
      '<td class="num '+(tot>0?'pos':'neg')+'">'+fmtSigned(tot)+'</td>' +
      '<td class="num">'+fmtSigned(Math.round(tot/rows.length))+'</td>' +
      '<td class="num">'+fmt(pausedByMeeting[k]||0)+'</td></tr>';
  });
  if (!Object.keys(gm).length) h += '<tr><td colspan="5" class="sub">No runs yet.</td></tr>';
  h += '</tbody></table>';

  // recent runs
  h += '<h3>Recent runs</h3><table class="stats"><thead><tr><th>When</th><th>Timer</th>' +
       '<th class="num">Planned</th><th class="num">Actual</th><th class="num">Variance</th><th class="num">Paused</th></tr></thead><tbody>';
  hist.slice(-15).reverse().forEach(r => {
    h += '<tr><td>'+esc(new Date(r.date).toLocaleString())+'</td><td>'+esc(r.timerLabel)+'</td>' +
      '<td class="num">'+fmt(r.plannedMs)+'</td><td class="num">'+fmt(r.actualMs)+'</td>' +
      '<td class="num '+(r.varianceMs>0?'pos':'neg')+'">'+fmtSigned(r.varianceMs)+'</td>' +
      '<td class="num">'+fmt(r.pausedMs)+'</td></tr>';
  });
  if (!hist.length) h += '<tr><td colspan="6" class="sub">No runs yet.</td></tr>';
  h += '</tbody></table>';

  h += '<div style="margin-top:18px"><button class="btn danger" data-act="clearHistory">Clear history</button></div>';
  el.innerHTML = h;
}
function tile(k,v){ return '<div class="tile"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'; }
function groupBy(arr, fn){ const o={}; arr.forEach(x=>{ const k=fn(x); (o[k]=o[k]||[]).push(x); }); return o; }
function driftTable(groups){
  let h = '<table class="stats"><thead><tr><th>Name</th><th class="num">Runs</th>' +
    '<th class="num">Total</th><th class="num">Average</th></tr></thead><tbody>';
  const keys = Object.keys(groups);
  if (!keys.length) return h + '<tr><td colspan="4" class="sub">No runs yet.</td></tr></tbody></table>';
  keys.sort((a,b)=>{ const ta=groups[b].reduce((x,r)=>x+r.varianceMs,0), tb=groups[a].reduce((x,r)=>x+r.varianceMs,0); return ta-tb; });
  keys.forEach(k => {
    const rows = groups[k], tot = rows.reduce((a,r)=>a+r.varianceMs,0), avg = Math.round(tot/rows.length);
    h += '<tr><td>'+esc(k)+'</td><td class="num">'+rows.length+'</td>' +
      '<td class="num '+(tot>0?'pos':'neg')+'">'+fmtSigned(tot)+'</td>' +
      '<td class="num '+(avg>0?'pos':'neg')+'">'+fmtSigned(avg)+'</td></tr>';
  });
  return h + '</tbody></table>';
}

function timerModal(title, t, onSave) {

    '<fieldset><legend>Pre-warning</legend><div class="g2">' +

    '<fieldset><legend>Time up (at zero)</legend>' +

    '<fieldset><legend>Overrun repeat</legend><div class="g2">' +
      '<div class="fld"><label>Every N seconds</label><input type="number" id="e_ovN" min="1" max="3600" value="'+t.overrun.n+'"></div>' +
      '<div class="fld"><label>Sound</label><select id="e_ovS">'+soundOptions(t.overrun.sound)+'</select></div></div></fieldset>' +

  );
  ["e_preS","e_upS","e_ovS"].forEach(id => $(id).addEventListener("change", e => playSound(e.target.value)));
  $("e_save").onclick = () => {
    const mn = clamp(parseInt($("e_min").value,10)||0, 0, 600);
    const sc = clamp(parseInt($("e_sec").value,10)||0, 0, 59);
    let dur = (mn*60+sc)*1000; if (dur <= 0) dur = 1000;
    t.label = $("e_label").value.trim() || "Timer";

    t.preWarn.n = clamp(parseInt($("e_preN").value,10)||1, 1, 3600); t.preWarn.sound = $("e_preS").value;
    t.timeUp.sound = $("e_upS").value;

// helpers to find nested objects
function findSession(id){ for (const m of store.meetings){ const s = m.sessions.find(x=>x.id===id); if (s) return {m,s}; } return null; }
function findTimerInMeetings(id){ for (const m of store.meetings) for (const s of m.sessions){ const t = s.timers.find(x=>x.id===id); if (t) return {m,s,t}; } return null; }

// editor navigation state
let editMeetingId = null, editSessionId = null;

// ==========================================================================
//  ACTION DISPATCH (event delegation on the whole document)
// ==========================================================================
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  const dir = parseInt(el.dataset.dir,10);

  switch (act) {
    case "closeModal": closeModal(); break;

    // --- meetings list ---
    case "newMeeting": {
      const m = newMeeting("New meeting"); store.meetings.push(m); save();
      editMeetingId = m.id; renderMeetingEditor(m); break; }
    case "loadMeeting": { const m = findMeeting(id); loadMeetingIntoRun(m, true); break; }
    case "renameMeeting": { const m = findMeeting(id); promptName("Rename meeting", m.title, v => { m.title=v; save(); renderMeetings(); }); break; }
    case "dupMeeting": { const m = findMeeting(id); const c = JSON.parse(JSON.stringify(m));
      reid(c); c.title = m.title + " (copy)"; c.pausedTotalMs = 0; store.meetings.push(c); save(); renderMeetings(); break; }
    case "delMeeting": { if (confirm("Delete this meeting? History stays.")) {
      store.meetings = store.meetings.filter(x=>x.id!==id);
      if (store.settings.activeMeetingId===id){ const m=activeMeeting(); loadMeetingIntoRun(m,false); }
      save(); renderMeetings(); } break; }
    case "editMeeting": { editMeetingId = id; renderMeetingEditor(findMeeting(id)); break; }
    case "backMeetings": renderMeetings(); break;
    case "editMeetingProps": { const m = findMeeting(id);
      textDurModal("Meeting", "Title", {text:m.title, durationMs:m.targetTotalMs}, (text,dur)=>{ m.title=text; m.targetTotalMs=dur; save(); renderMeetingEditor(m); }); break; }

    // --- sessions ---
    case "newSession": { const m = findMeeting(id); const s = newSession("New session");
      m.sessions.push(s); save(); renderMeetingEditor(m); break; }
    case "editSession": { const f = findSession(id); editSessionId = id; renderSessionEditor(f.m, f.s); break; }
    case "editSessionProps": { const f = findSession(id);
      sessionModal("Edit session", f.s, ()=>{ save(); renderSessionEditor(f.m, f.s); }); break; }
    case "dupSession": { const f = findSession(id); const c = JSON.parse(JSON.stringify(f.s)); reidSession(c);
      c.title = f.s.title + " (copy)"; const i = f.m.sessions.indexOf(f.s); f.m.sessions.splice(i+1,0,c); save(); renderMeetingEditor(f.m); break; }
    case "delSession": { const f = findSession(id); if (confirm("Delete session?")) {
      f.m.sessions = f.m.sessions.filter(x=>x.id!==id); save(); renderMeetingEditor(f.m); } break; }
    case "moveSession": { const f = findSession(id); move(f.m.sessions, f.s, dir); save(); renderMeetingEditor(f.m); break; }

    // --- timers in a session ---
    case "newTimerInline": { const f = findSession(id); const t = newTimer("New timer",5,0);
      timerModal("New timer", t, ()=>{ f.s.timers.push(t); recomputeSessionPlanned(f.s); save(); renderSessionEditor(f.m, f.s); }); break; }
    case "addFromLib": { const f = findSession(id); libPickerModal(def => {
      f.s.timers.push(cloneTimer(def)); recomputeSessionPlanned(f.s); save(); renderSessionEditor(f.m, f.s); }); break; }
    case "editTimer": { const f = findTimerInMeetings(id);
      timerModal("Edit timer", f.t, ()=>{ recomputeSessionPlanned(f.s); save(); renderSessionEditor(f.m, f.s); }); break; }
    case "dupTimer": { const f = findTimerInMeetings(id); const c = cloneTimer(f.t); c.label = f.t.label + " (copy)";
      const i = f.s.timers.indexOf(f.t); f.s.timers.splice(i+1,0,c); recomputeSessionPlanned(f.s); save(); renderSessionEditor(f.m, f.s); break; }
    case "delTimer": { const f = findTimerInMeetings(id); f.s.timers = f.s.timers.filter(x=>x.id!==id);
      recomputeSessionPlanned(f.s); save(); renderSessionEditor(f.m, f.s); break; }
    case "moveTimer": { const f = findTimerInMeetings(id); move(f.s.timers, f.t, dir); save(); renderSessionEditor(f.m, f.s); break; }
    case "saveToLib": { const f = findTimerInMeetings(id); store.library.push(cloneTimer(f.t)); save();
      flash(el, "Saved"); break; }

    // --- library ---
    case "newLibTimer": { const t = newTimer("New timer",5,0);
      timerModal("New library timer", t, ()=>{ store.library.push(t); save(); renderLibrary(); }); break; }
    case "editLibTimer": { const t = store.library.find(x=>x.id===id);
      timerModal("Edit library timer", t, ()=>{ save(); renderLibrary(); }); break; }
    case "dupLibTimer": { const t = store.library.find(x=>x.id===id); const c = cloneTimer(t); c.label = t.label + " (copy)";
      store.library.push(c); save(); renderLibrary(); break; }
    case "delLibTimer": { if (confirm("Delete library timer?")) { store.library = store.library.filter(x=>x.id!==id); save(); renderLibrary(); } break; }

    // --- meeting summary ---
    case "doneToMeetings": showManage("meetings"); break;
    case "doneToHistory": showManage("history"); break;
    case "doneRunAgain": {
      run.index = 0; run.sessionUsed = {}; run.records = [];
      resetTimer(); showRun(); break; }

    // --- data / backup ---
    case "exportJSON": exportJSON(); break;
    case "exportCSV": exportCSV(); break;
    case "importJSON": $("importFile").click(); break;
    case "reseedSample": {
      const fresh = seed();
      fresh.library.forEach(t => store.library.push(t));
      fresh.meetings.forEach(m => store.meetings.push(m));
      save(); loadMeetingIntoRun(store.meetings[store.meetings.length-1], false);
      toast("Sample meeting added.");
      if (document.body.classList.contains("managing")) renderManage(); else showRun();
      break; }
    case "factoryReset": {
      if (!confirm("Erase all meetings, library timers and history in this browser, and start again from the sample?")) break;
      if (!confirm("Last check — this cannot be undone. Continue?")) break;
      store = seed(); save(); mountRenderer(); loadMeetingIntoRun(activeMeeting(), false);
      toast("Everything erased and reseeded."); renderManage(); break; }

    // --- history ---
    case "clearHistory": { if (confirm("Clear all run history and reset paused totals?")) {
      store.history = []; store.meetings.forEach(m=>m.pausedTotalMs=0); save(); renderHistory(); } break; }
  }
});

function move(arr, item, dir) { const i = arr.indexOf(item), j = i + dir;
  if (i<0 || j<0 || j>=arr.length) return; arr.splice(i,1); arr.splice(j,0,item); }
function reidSession(s){ s.id = uid(); s.timers.forEach(t=>t.id=uid()); }
function reid(m){ m.id = uid(); m.sessions.forEach(reidSession); }
function flash(el, msg){ const o = el.textContent; el.textContent = msg; setTimeout(()=>{ el.textContent = o; }, 900); }

$("btnEnd").addEventListener("click", endTimer);
$("btnNext").addEventListener("click", nextTimer);

$("overlay").addEventListener("mousedown", (e) => { if (e.target === $("overlay")) closeModal(); });

document.addEventListener("keydown", (e) => {
  if ($("overlay").classList.contains("open")) { if (e.key === "Escape") { e.preventDefault(); closeModal(); } return; }
  const tag = (e.target.tagName||"").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;
  if (document.body.classList.contains("summarizing")) {
    if (e.key === "Escape" || e.key === "n" || e.key === "N") { e.preventDefault(); showManage("meetings"); }
    else if (e.key === "s" || e.key === "S") { e.preventDefault(); showManage(); }
    return;
  }
  if (document.body.classList.contains("managing")) { if (e.key === "Escape" || e.key === "s" || e.key === "S") { e.preventDefault(); showRun(); } return; }
  switch (e.key) {
    case " ": case "Spacebar": e.preventDefault(); toggleStartPause(); break;
    case "r": case "R": e.preventDefault(); resetTimerAndRender(); break;
    case "e": case "E": e.preventDefault(); endTimer(); break;
    case "n": case "N": e.preventDefault(); nextTimer(); break;
    case "s": case "S": e.preventDefault(); showManage(); break;
  }
});

// ==========================================================================
//  SERVICE WORKER (optional sidecar — absence is not an error)
// ==========================================================================
function registerSW() {
  if (location.protocol === "file:" || !("serviceWorker" in navigator)) return;
  navigator.serviceWorker.register("sw.js").then(reg => {
    // A worker waiting to take over means a newer version is already cached.
    const offerUpdate = (w) => toast("A new version is ready.", {
      sticky: true, actionLabel: "Reload",
      onAction: () => { w.postMessage("skipWaiting"); location.reload(); },
    });
    if (reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);
    reg.addEventListener("updatefound", () => {
      const w = reg.installing;
      if (!w) return;
      w.addEventListener("statechange", () => {
        if (w.state === "installed" && navigator.serviceWorker.controller) offerUpdate(w);
      });
    });
    reportSWState();
  }).catch(() => { /* sidecar missing or blocked — app still works */ });
}

// ==========================================================================
//  INIT
// ==========================================================================
load();
mountRenderer();
loadMeetingIntoRun(activeMeeting(), false);
showRun();
requestAnimationFrame(loop);
registerSW();
</script>
