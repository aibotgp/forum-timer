/* ==========================================================================
   TOKENS
   ========================================================================== */
:root{
  --bg:#f5ead8; --surface:#ebddc5; --raise:#f9f4ed;
  --ink:#201e1d; --ink2:#645c50; --line:rgba(32,30,29,.14);
  --go:#56633f; --warn:#b2622d; --over:#9e3b25; --accent:#c67139;
  --s1:4.4px; --s2:8.8px; --s3:13.2px; --s4:17.6px; --s5:26.4px; --s6:35.2px;
  --r1:8px; --r2:16px; --r3:28px; --rp:999px;
  --display:"Caprasimo",Georgia,serif;
  --body:"Figtree",system-ui,-apple-system,sans-serif;
  --phase:var(--ink2); --t:220ms ease;
}
[data-theme="dark"]{
  --bg:#201e1d; --surface:#2e2b25; --raise:#3a352e;
  --ink:#f5ead8; --ink2:#a19786; --line:rgba(245,234,216,.16);
  --go:#aebf92; --warn:#f6a06b; --over:#e0715a; --accent:#c67139;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;transition:background-color var(--t),color var(--t);
  display:flex;flex-direction:column;overflow:hidden}
body:not([data-view="run"]) main{overflow:auto}

/* Room mode — opt-in flood for projectors; off by default (restraint rule). */
body.room[data-phase="running"]{--bg:color-mix(in srgb,var(--go) 15%,#201e1d)}
body.room[data-phase="prewarn"]{--bg:color-mix(in srgb,var(--warn) 20%,#201e1d)}
body.room[data-phase="overrun"]{--bg:color-mix(in srgb,var(--over) 26%,#201e1d)}
body.room[data-theme="light"][data-phase="running"]{--bg:color-mix(in srgb,var(--go) 22%,#f5ead8)}
body.room[data-theme="light"][data-phase="prewarn"]{--bg:color-mix(in srgb,var(--warn) 26%,#f5ead8)}
body.room[data-theme="light"][data-phase="overrun"]{--bg:color-mix(in srgb,var(--over) 30%,#f5ead8)}

h1,h2,h3,.display{font-family:var(--display);font-weight:400;line-height:1.12}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.kicker{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink2);font-weight:600}
.muted{color:var(--ink2)}
.go{color:var(--go)}.warn{color:var(--warn)}.over{color:var(--over)}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:var(--s5);padding:var(--s3) var(--s5);
  border-bottom:1px solid var(--line);flex:0 0 auto}
.brand{font-family:var(--display);font-size:20px;white-space:nowrap}
nav.main{display:flex;gap:var(--s1);flex-wrap:wrap}
nav.main button{padding:6px 10px;color:var(--ink2);font-weight:600;font-size:14.5px;
  border-bottom:2px solid transparent;transition:color var(--t)}
nav.main button:hover{color:var(--ink)}
nav.main button.on{color:var(--ink);border-bottom-color:var(--accent)}
.topmeta{margin-left:auto;text-align:right;font-size:13px;color:var(--ink2);min-width:0}
.topmeta .line1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topmeta input[type=text]{background:none;border:none;border-radius:0;text-align:right;color:var(--ink);font-size:13px;
  width:min(340px,36vw);padding:2px 0;border-bottom:1px solid transparent}
.topmeta input::placeholder{color:var(--ink2);opacity:.7}
.topmeta input[type=text]:hover,.topmeta input[type=text]:focus{border-bottom-color:var(--line);outline:none;border-color:transparent;border-bottom-color:var(--line)}

.pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface);
  border-radius:var(--rp);padding:7px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.pill .k{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink2);font-weight:600}
.pill.tint-warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.tint-over{background:color-mix(in srgb,var(--over) 22%,transparent);color:var(--over)}
.pill.tint-go{background:color-mix(in srgb,var(--go) 20%,transparent);color:var(--go)}
.pill.tint-warn .k,.pill.tint-over .k,.pill.tint-go .k{color:inherit;opacity:.8}

.btn{border-radius:var(--rp);padding:9px 18px;font-weight:600;font-size:14.5px;
  background:var(--surface);color:var(--ink);border:1px solid transparent;transition:background var(--t)}
.btn:hover{background:var(--raise)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:var(--line)}
.btn.ghost:hover{background:var(--surface)}
.btn.sm{padding:6px 13px;font-size:13.5px}
.btn.danger{color:var(--over);border:1px solid color-mix(in srgb,var(--over) 40%,transparent);background:none}
.btn.danger:hover{background:color-mix(in srgb,var(--over) 14%,transparent)}
.btn:disabled{opacity:.4;cursor:default}

/* ---------- views ---------- */
main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.view{display:none;flex:1 1 auto;min-height:0}
.view.on{display:flex;flex-direction:column}
.pad{padding:var(--s5);max-width:1180px;width:100%;margin:0 auto}
.page-h{margin-bottom:var(--s5)}
.page-h h1{font-size:34px}
.page-h p{color:var(--ink2);margin-top:6px;max-width:76ch}
.row-between{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4);flex-wrap:wrap}
.inline{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:flex-end}

/* ---------- run ---------- */
#v-run{padding:var(--s4) var(--s5) var(--s3);gap:var(--s3)}
.run-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4);flex-wrap:wrap}
.run-head h2{font-size:26px;margin-top:2px}
.run-pills{display:flex;gap:var(--s2);flex-wrap:wrap}
.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:var(--s2);text-align:center}
.timer-label{font-family:var(--display);font-size:clamp(22px,3.4vw,34px)}
.numerals{font-family:var(--body);font-weight:600;font-size:clamp(90px,19vw,300px);
  letter-spacing:-.03em;line-height:.86;color:var(--phase);
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;transition:color var(--t)}
.metaline{color:var(--ink2);font-size:15px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.metaline .sep{opacity:.45}
#viz{width:100%;max-width:1180px;margin:var(--s3) auto 0}
.ribbon{height:22px;background:var(--surface);border-radius:var(--rp);position:relative;overflow:hidden}
.ribbon .fill{position:absolute;inset:0;background:var(--phase);border-radius:var(--rp);
  transform-origin:left center;transition:transform 120ms linear}
.ribbon .ovr{position:absolute;inset:0;background:var(--over);border-radius:var(--rp);
  transform-origin:right center;transform:scaleX(0);transition:transform 120ms linear}
.ringwrap{display:flex;justify-content:center}
.dial{width:clamp(110px,20vh,200px);aspect-ratio:1;border-radius:50%;
  -webkit-mask:radial-gradient(circle,transparent 57%,#000 58%);
  mask:radial-gradient(circle,transparent 57%,#000 58%)}
.fieldwrap{height:clamp(64px,12vh,120px);background:var(--surface);border-radius:var(--r2);
  position:relative;overflow:hidden}
.fieldwrap .lvl{position:absolute;left:0;right:0;bottom:0;height:100%;
  transform-origin:bottom center;transition:transform 140ms linear}

.transport{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
  border-top:1px solid var(--line);padding-top:var(--s3)}
.tbtn{border-radius:var(--rp);padding:12px 22px;background:var(--surface);font-weight:600;font-size:16px;
  display:inline-flex;align-items:center;gap:10px;transition:background var(--t)}
.tbtn:hover{background:var(--raise)}
.tbtn .sc{font-size:12.5px;color:var(--ink2);font-weight:600}
.tbtn.primary{background:var(--phase);color:var(--bg)}
.tbtn.primary .sc{color:inherit;opacity:.75}
.tbtn:disabled{opacity:.4;cursor:default}
.tspacer{margin-left:auto;display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.seg{display:inline-flex;gap:4px;align-items:center}
.seg .lbl{font-size:12.5px;color:var(--ink2);margin-right:2px}
.seg button{padding:5px 11px;border-radius:var(--rp);font-size:12.5px;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600}

/* ---------- cards / grids ---------- */
.card{background:var(--surface);border-radius:var(--r3);padding:var(--s4) var(--s5)}
.grid{display:grid;gap:var(--s3)}
.grid.auto{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.grid.cards{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.grid.stats{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat .k{font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink2);font-weight:600}
.stat .v{font-size:38px;font-weight:600;letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.stat .s{font-size:13px;color:var(--ink2)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
.panel-h{font-family:var(--body);font-weight:700;font-size:19px}

/* ---------- build board ---------- */
.board{display:flex;gap:var(--s3);overflow-x:auto;padding-bottom:var(--s4);align-items:flex-start}
.col{background:var(--surface);border-radius:var(--r3);padding:var(--s4);width:300px;flex:0 0 auto;
  border:2px solid transparent}
.col.active{border-color:var(--accent)}
.col.dragover{border-color:var(--accent);border-style:dashed;
  background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.col-h{display:flex;align-items:center;gap:8px;justify-content:space-between}
.col-h .nm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.col-sub{color:var(--ink2);font-size:12.5px;margin:4px 0 var(--s3)}
.col-sub button{font-size:12.5px}
.tcard{background:var(--raise);border-radius:var(--r2);padding:12px 14px;margin-bottom:var(--s2);
  display:flex;align-items:center;gap:10px;position:relative}
.tcard[draggable="true"]{cursor:grab}
.tcard.done{opacity:.6}
.tcard.now{box-shadow:0 6px 18px rgba(0,0,0,.18);transform:rotate(.6deg)}
.tcard .grab{color:var(--ink2);font-size:14px;line-height:1}
.tcard .body{flex:1 1 auto;min-width:0}
.tcard .lab{font-weight:600;font-size:14.5px;display:block;overflow:hidden;text-overflow:ellipsis}
.tcard .sub{font-size:12px;color:var(--ink2);display:block}
.tcard .dur{font-variant-numeric:tabular-nums;font-weight:600;font-size:14.5px}
.tcard .mv{display:flex;gap:2px;opacity:0;transition:opacity var(--t);position:absolute;right:58px;top:50%;transform:translateY(-50%);background:var(--raise);box-shadow:-8px 0 8px var(--raise);border-radius:8px;z-index:2}
.tcard:hover .mv,.tcard:focus-within .mv{opacity:1}
.tcard .mv button{font-size:12px;color:var(--ink2);padding:2px 5px;border-radius:6px}
.tcard .mv button:hover{background:var(--surface);color:var(--ink)}
.dashed{border:1.5px dashed var(--line);border-radius:var(--r2);padding:12px;width:100%;
  color:var(--ink2);font-size:14px;text-align:center}
.dashed:hover{border-color:var(--accent);color:var(--ink)}
.addcol{width:260px;flex:0 0 auto;min-height:130px;border-radius:var(--r3)}

/* ---------- bars / chart / table ---------- */
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:minmax(90px,1.2fr) 3fr auto;gap:12px;align-items:center;font-size:14px}
.bartrack{height:12px;background:var(--raise);border-radius:var(--rp);overflow:hidden}
.barfill{height:100%;border-radius:var(--rp)}
.chart{display:flex;align-items:stretch;gap:6px;height:190px;padding-top:6px}
.chart .colw{flex:1 1 0;display:flex;flex-direction:column;height:100%}
.chart .up{flex:1 1 auto;display:flex;align-items:flex-end}
.chart .dn{flex:0 0 34%;display:flex;align-items:flex-start}
.chart .b{width:100%;border-radius:6px 6px 0 0;min-height:2px}
.chart .b.down{border-radius:0 0 6px 6px;background:color-mix(in srgb,var(--ink2) 45%,transparent)}
.hair{height:1px;background:var(--line)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--ink2);font-weight:600;padding:0 12px 10px}
table.t td{padding:13px 12px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
table.t td:first-child{font-variant-numeric:normal}

/* ---------- alerts editor ---------- */
.arow{background:var(--surface);border-radius:var(--r3);padding:var(--s4) var(--s5);
  display:grid;grid-template-columns:minmax(150px,1fr) 1.3fr 1.3fr auto;gap:var(--s4);
  align-items:center;margin-bottom:var(--s3)}
.arow .nm{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.arow .fl{font-size:12px;color:var(--ink2)}
.arow .fv{font-size:15px;margin-top:2px}
.note{background:color-mix(in srgb,var(--go) 26%,transparent);border-radius:var(--r3);
  padding:var(--s4) var(--s5);font-size:14px;max-width:82ch}
.field{display:grid;gap:5px}
.field label{font-size:12.5px;color:var(--ink2)}
input[type=text],input[type=number],select{background:var(--surface);border:1px solid transparent;
  border-radius:var(--rp);padding:10px 16px;width:100%;font-size:15px}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--accent);outline:none}

/* ---------- empty / modal / toast ---------- */
.blank{text-align:center;padding:var(--s6) var(--s4);border:1.5px dashed var(--line);border-radius:var(--r3)}
.blank h3{font-family:var(--display);font-size:22px;margin-bottom:8px}
.blank p{color:var(--ink2);max-width:56ch;margin:0 auto var(--s4)}
.blank .acts{display:flex;gap:var(--s2);justify-content:center;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:var(--s4);z-index:60}
.overlay.open{display:flex}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:var(--r3);padding:var(--s5);
  width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal h2{font-size:24px;margin-bottom:6px}
.modal .hint{color:var(--ink2);font-size:14px;margin-bottom:var(--s4)}
.modal-actions{display:flex;gap:var(--s2);justify-content:flex-end;margin-top:var(--s4)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,260%);visibility:hidden;background:var(--raise);
  border:1px solid var(--line);border-radius:var(--rp);padding:12px 20px;font-size:14.5px;
  font-weight:600;z-index:70;display:flex;gap:14px;align-items:center;max-width:min(560px,92vw);
  box-shadow:0 14px 44px rgba(0,0,0,.28);transition:transform 260ms ease}
.toast.show{transform:translate(-50%,0);visibility:visible}
.toast.warn{border-color:color-mix(in srgb,var(--over) 60%,transparent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 22px;font-size:14px}
.kv dt{color:var(--ink2)}
.kv dd{font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){
  *,.ribbon .fill,.ribbon .ovr,.fieldwrap .lvl,.toast{transition:none !important}
  .tcard.now{transform:none}
}
@media (max-width:860px){
  .topbar{flex-wrap:wrap;gap:var(--s3)}
  .topmeta{margin-left:0;text-align:left;width:100%}
  .topmeta input{text-align:left;width:100%}
  .arow{grid-template-columns:1fr;gap:var(--s2)}
}
</style>
</head>
<body data-theme="dark" data-view="home" data-phase="idle">

<main>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" style="display:none">

<script>
"use strict";
/* ==========================================================================
   Forum Timer — design system build
   One self-contained file, vanilla JS, no dependencies. sw.js and
   manifest.webmanifest are optional sidecars for offline install.
   All time is computed from Date.now() deltas, never by counting ticks.
   ========================================================================== */

const APP_VERSION = "3.0.0";
const $ = (id) => document.getElementById(id);
const uid = () => "id" + Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function fmt(ms){
  const neg = ms < 0; ms = Math.abs(ms);
  const t = Math.floor(ms/1000), h = Math.floor(t/3600), m = Math.floor((t%3600)/60), s = t%60;
  const core = h > 0 ? h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")
                     : String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  return (neg ? "−" : "") + core;
}
const fmtSigned = (ms) => (ms > 0 ? "+" : ms < 0 ? "−" : "") + fmt(Math.abs(ms));
function fmtLoose(ms){
  const t = Math.floor(Math.abs(ms)/1000);
  return Math.floor(t/60) + ":" + String(t%60).padStart(2,"0");
}
const longDate = (d) => d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"});

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, o){
  o = o || {}; const t = $("toast");
  t.className = "toast" + (o.warn ? " warn" : "");
  t.innerHTML = "<span>" + esc(msg) + "</span>";
  if (o.actionLabel){
    const b = document.createElement("button");
    b.className = "btn primary sm"; b.textContent = o.actionLabel;
    b.onclick = () => { hideToast(); if (o.onAction) o.onAction(); };
    t.append(b);
  }
  requestAnimationFrame(() => t.classList.add("show"));
  clearTimeout(toastTimer);
  if (!o.sticky) toastTimer = setTimeout(hideToast, o.ms || 3200);
}
const hideToast = () => { clearTimeout(toastTimer); $("toast").classList.remove("show"); };

/* ---------- downloads ---------- */
function downloadFile(name, text, mime){
  const blob = new Blob([text], {type:(mime||"text/plain")+";charset=utf-8"});
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
const stamp = () => { const d = new Date(), p = n => String(n).padStart(2,"0");
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes()); };

/* ==========================================================================
   SOUND — synthesised; unlocked on a user gesture or Safari stays silent
   ========================================================================== */
const SOUNDS = {none:"None (muted)", soft:"Soft chime", beep:"Beep", chime:"Chime",
                bell:"Low bell", alarm:"Alarm", buzz:"Buzz"};
let audioCtx = null;
function ensureAudio(){
  if (!audioCtx){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; audioCtx = new AC(); }
  if (audioCtx.state === "suspended") audioCtx.resume();
}
function tone(freq, off, dur, type, peak){
  const t0 = audioCtx.currentTime + off, osc = audioCtx.createOscillator(), g = audioCtx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0 + .02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(audioCtx.destination); osc.start(t0); osc.stop(t0 + dur + .02);
}
function playSound(id){
  if (!id || id === "none") return; ensureAudio(); if (!audioCtx) return;
  switch(id){
    case "soft":  tone(523.25,0,.45,"sine",.28); break;
    case "beep":  tone(880,0,.16,"square",.22); break;
    case "chime": tone(659.25,0,.28,"sine",.3); tone(987.77,.16,.42,"sine",.28); break;
    case "bell":  tone(392,0,1.1,"sine",.34); tone(784,0,.6,"sine",.12); break;
    case "alarm": tone(1150,0,.12,"square",.28); tone(1150,.2,.12,"square",.28); tone(1150,.4,.12,"square",.28); break;
    case "buzz":  tone(150,0,.55,"sawtooth",.24); break;
  }
}

/* ==========================================================================
   MODEL + PERSISTENCE
   ========================================================================== */
const STORE_KEY = "forumTimer.v1";
let store = null;

const newTimer = (label,min,sec) => ({ id:uid(), label:label||"Timer",
  durationMs:((min||0)*60+(sec||0))*1000,
  preWarn:{n:120,sound:"soft"}, timeUp:{sound:"bell"}, overrun:{n:30,sound:"alarm"} });
const cloneTimer = (t) => ({ id:uid(), label:t.label, durationMs:t.durationMs,
  preWarn:{...t.preWarn}, timeUp:{...t.timeUp}, overrun:{...t.overrun} });
const newSession = (title) => ({ id:uid(), title:title||"Session", plannedMs:0,
  bufferBeforeMs:0, bufferAfterMs:0, timers:[] });
const newMeeting = (title) => ({ id:uid(), title:title||"Meeting", targetTotalMs:0,
  pausedTotalMs:0, notes:"", sessions:[] });
const recomputeSessionPlanned = (s) => { s.plannedMs = s.timers.reduce((a,t)=>a+t.durationMs,0); };
const sessionPool = (s) => (s.bufferBeforeMs||0) + (s.bufferAfterMs||0);

function seed(){
  const lib = [ newTimer("Business Update",10,0), newTimer("Feedback Round",10,0),
    newTimer("Welcome & intention",5,0), newTimer("Housekeeping",10,0),
    newTimer("Coffee",10,0), newTimer("Deep Dive",45,0) ];
  lib[2].preWarn = {n:60,sound:"soft"};  lib[2].overrun = {n:30,sound:"none"};
  lib[4].preWarn = {n:60,sound:"none"};  lib[4].overrun = {n:60,sound:"none"};

  const m = newMeeting("EO Forum — Monthly");
  m.targetTotalMs = 180*60*1000;
  const s1 = newSession("Opening");
  s1.bufferBeforeMs = 2*60*1000; s1.bufferAfterMs = 2*60*1000;
  s1.timers = [cloneTimer(lib[2]), cloneTimer(lib[3])];
  const s2 = newSession("Member Update");
  s2.bufferAfterMs = 10*60*1000;
  s2.timers = [cloneTimer(lib[0]), cloneTimer(lib[0]), cloneTimer(lib[1])];
  s2.timers[0].label = "Sara — Business Update";
  s2.timers[1].label = "Marcus — Business Update";
  s2.timers[2].label = "Kate — Feedback Round";
  const s3 = newSession("Break");
  s3.timers = [cloneTimer(lib[4])];
  m.sessions = [s1,s2,s3]; m.sessions.forEach(recomputeSessionPlanned);
  return { version:2, library:lib, meetings:[m], history:[],
           settings:{rendererId:"ribbon", activeMeetingId:m.id, theme:"auto",
                     roomMode:false, layout:"centred"} };
}
function migrate(s){
  s.settings = s.settings || {};
  if (s.settings.rendererId === "bar") s.settings.rendererId = "ribbon";
  if (!(s.settings.rendererId in Renderers)) s.settings.rendererId = "ribbon";
  if (!s.settings.theme) s.settings.theme = "auto";
  if (typeof s.settings.roomMode !== "boolean") s.settings.roomMode = false;
  if (!s.settings.layout) s.settings.layout = "centred";
  s.library  = Array.isArray(s.library)  ? s.library  : [];
  s.meetings = Array.isArray(s.meetings) ? s.meetings : [];
  s.history  = Array.isArray(s.history)  ? s.history  : [];
  s.meetings.forEach(m => {
    m.pausedTotalMs = m.pausedTotalMs || 0; m.notes = m.notes || "";
    m.sessions = Array.isArray(m.sessions) ? m.sessions : [];
    m.sessions.forEach(x => { x.timers = Array.isArray(x.timers) ? x.timers : []; recomputeSessionPlanned(x); });
  });
  // rows written before runIds existed: group by meeting + calendar day
  s.history.forEach(r => { if (!r.runId) r.runId = (r.meetingId||"m") + "|" + String(r.date).slice(0,10); });
  s.version = 2;
  return s;
}
function load(){
  try { const raw = localStorage.getItem(STORE_KEY); if (raw){ store = migrate(JSON.parse(raw)); return; } }
  catch(e){}
  store = seed(); save();
}
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e){} };

const findMeeting = (id) => store.meetings.find(m => m.id === id);
const activeMeeting = () => findMeeting(store.settings.activeMeetingId) || null;
function findSessionOf(id){ for (const m of store.meetings){ const s = m.sessions.find(x=>x.id===id); if (s) return {m,s}; } return null; }
function findTimerOf(id){ for (const m of store.meetings) for (const s of m.sessions){ const t = s.timers.find(x=>x.id===id); if (t) return {m,s,t}; } return null; }
const meetingPlanned = (m) => m.sessions.reduce((a,s)=>a+s.plannedMs,0);

/* ==========================================================================
   RUN ENGINE
   ========================================================================== */
const run = { steps:[], index:0, state:"idle", runId:null, startEpoch:0, elapsedBeforePause:0,
  pausedAccumMs:0, pauseStartEpoch:0, preWarnFired:false, timeUpFired:false, overrunBeeps:0,
  sessionUsed:{}, recorded:false, records:[] };

function buildSteps(m){ run.steps = []; if (m) m.sessions.forEach(s => s.timers.forEach(t => run.steps.push({session:s,timer:t}))); }
const curStep = () => run.steps[run.index] || null;
const curTimer = () => (curStep()||{}).timer || null;
const curSession = () => (curStep()||{}).session || null;
const isLastStep = () => run.index >= run.steps.length - 1;
const elapsedMs = () => run.state === "running"
  ? run.elapsedBeforePause + (Date.now() - run.startEpoch) : run.elapsedBeforePause;

function resetTimer(){
  run.state="idle"; run.elapsedBeforePause=0; run.pausedAccumMs=0;
  run.preWarnFired=false; run.timeUpFired=false; run.overrunBeeps=0; run.recorded=false;
}
function loadMeetingIntoRun(m, goRun){
  store.settings.activeMeetingId = m ? m.id : null; save();
  buildSteps(m);
  run.index = 0; run.sessionUsed = {}; run.records = []; run.runId = uid();
  resetTimer();
  if (goRun) go("run");
}
function startTimer(){
  ensureAudio();
  if (!curTimer() || run.state === "running") return;
  if (run.state === "paused") run.pausedAccumMs += Date.now() - run.pauseStartEpoch;
  else if (run.state !== "paused" && run.state !== "running"){
    run.elapsedBeforePause=0; run.pausedAccumMs=0;
    run.preWarnFired=false; run.timeUpFired=false; run.overrunBeeps=0; run.recorded=false;
  }
  run.startEpoch = Date.now(); run.state = "running"; renderRun();
}
function pauseTimer(){
  if (run.state !== "running") return;
  run.elapsedBeforePause += Date.now() - run.startEpoch;
  run.pauseStartEpoch = Date.now(); run.state = "paused"; renderRun();
}
const toggleStartPause = () => run.state === "running" ? pauseTimer() : startTimer();

// Close the open segment BEFORE recording — otherwise elapsedMs() counts the
// live segment a second time and every stored duration is inflated.
function settle(){
  if (run.state === "running") run.elapsedBeforePause += Date.now() - run.startEpoch;
  else if (run.state === "paused") run.pausedAccumMs += Date.now() - run.pauseStartEpoch;
  run.state = "settled";
}
function recordRun(){
  const step = curStep(); if (!step || run.recorded) return;
  const t = step.timer, s = step.session, m = activeMeeting();
  const actual = elapsedMs(), variance = actual - t.durationMs;
  const rec = { id:uid(), runId:run.runId, date:new Date().toISOString(),
    meetingId:m?m.id:null, meetingTitle:m?m.title:"(ad-hoc)",
    sessionId:s.id, sessionTitle:s.title, timerId:t.id, timerLabel:t.label,
    plannedMs:t.durationMs, actualMs:actual, varianceMs:variance, pausedMs:run.pausedAccumMs };
  store.history.push(rec); run.records.push(rec);
  if (m) m.pausedTotalMs = (m.pausedTotalMs||0) + run.pausedAccumMs;
  run.sessionUsed[s.id] = (run.sessionUsed[s.id]||0) + Math.max(0, variance);
  run.recorded = true; save();
}
function endTimer(){ if (run.state === "idle") return; settle(); recordRun(); run.state = "ended"; renderRun(); }
function nextTimer(){
  if (!curStep()) return;
  const wasIdle = run.state === "idle";
  settle(); if (!wasIdle) recordRun();
  if (!isLastStep()){ run.index++; resetTimer(); renderRun(); }
  else { run.state = "ended"; go("summary"); }
}
function checkAlerts(elapsed){
  const t = curTimer(); if (!t || run.state !== "running") return;
  const remaining = t.durationMs - elapsed;
  if (!run.preWarnFired && remaining <= t.preWarn.n*1000){ run.preWarnFired = true; playSound(t.preWarn.sound); }
  if (!run.timeUpFired && elapsed >= t.durationMs){ run.timeUpFired = true; playSound(t.timeUp.sound); }
  if (elapsed > t.durationMs){
    const due = Math.floor((elapsed - t.durationMs)/(t.overrun.n*1000));
    if (due > run.overrunBeeps){ run.overrunBeeps = due; playSound(t.overrun.sound); }
  }
}

/* ==========================================================================
   RENDERERS — swappable graphic; renderers never read app state.
   mount(root) · draw({phase,remaining,overrun,color,reducedMotion}) · unmount()
   ========================================================================== */
const Renderers = {
  ribbon:{ name:"Ribbon",
    mount(root){ root.innerHTML = '<div class="ribbon"><div class="fill" id="_fill"></div><div class="ovr" id="_ovr"></div></div>'; },
    draw(st){ const f=$("_fill"), o=$("_ovr"); if(!f) return;
      f.style.transform = "scaleX(" + clamp(st.remaining,0,1) + ")";
      o.style.transform = "scaleX(" + clamp(st.overrun,0,1) + ")"; },
    unmount(){} },
  ring:{ name:"Ring",
    mount(root){ root.innerHTML = '<div class="ringwrap"><div class="dial" id="_dial"></div></div>'; },
    draw(st){ const d=$("_dial"); if(!d) return;
      const frac = st.remaining > 0 ? st.remaining : st.overrun;
      const col = st.remaining > 0 ? "var(--phase)" : "var(--over)";
      d.style.background = "conic-gradient(" + col + " " + clamp(frac,0,1) + "turn, var(--surface) 0)"; },
    unmount(){} },
  field:{ name:"Field",
    mount(root){ root.innerHTML = '<div class="fieldwrap"><div class="lvl" id="_lvl"></div></div>'; },
    draw(st){ const l=$("_lvl"); if(!l) return;
      const frac = st.remaining > 0 ? st.remaining : st.overrun;
      l.style.transform = "scaleY(" + clamp(frac,0,1) + ")";
      l.style.background = st.remaining > 0
        ? "color-mix(in srgb,var(--phase) 55%,transparent)"
        : "color-mix(in srgb,var(--over) 60%,transparent)"; },
    unmount(){} },
};
let activeRenderer = null;
function mountRenderer(){
  const id = (store.settings.rendererId in Renderers) ? store.settings.rendererId : "ribbon";
  if (activeRenderer && activeRenderer.unmount) activeRenderer.unmount();
  activeRenderer = Renderers[id];
  activeRenderer.mount($("viz"));
}
const reducedMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ==========================================================================
   THEME
   ========================================================================== */
function applyTheme(){
  const pref = store.settings.theme;
  const dark = pref === "dark" || (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.body.dataset.theme = dark ? "dark" : "light";
  $("themeBtn").textContent = dark ? "Light" : "Dark";
  document.body.classList.toggle("room", !!store.settings.roomMode);
}

/* ==========================================================================
   ROUTING

/* ==========================================================================
   RUN
   ========================================================================== */
function phaseFor(remaining){
  const t = curTimer();
  if (!t || run.state === "idle") return "idle";
  if (run.state === "ended" || run.state === "settled") return "ended";
  if (remaining <= 0) return "overrun";
  if (remaining <= t.preWarn.n*1000) return "prewarn";
  return "running";
}
function statusCopy(phase, remaining, bufLeft){
  if (run.state === "paused") return "Paused — the clock is waiting for you";
  switch(phase){
    case "idle": return "Ready when you are";
    case "running": return "Running comfortably";
    case "prewarn": return "Nearly there — " + fmtLoose(remaining) + " left";
    case "overrun": return "You're " + fmtLoose(-remaining) + " over — " +
      (bufLeft >= 0 ? "buffer covers it for now" : "buffer is spent, the meeting has expanded");
    case "ended": return "Ended — nothing was cut short";
  }
  return "";
}
/* Rendering is deliberately split in two:
     renderRun()  rebuilds the chrome (transport buttons, titles) — only on a
                  state change, never per frame.
     paintRun()   runs every animation frame and touches text and graphics only.
   Rebuilding the transport 60×/sec would detach buttons mid-click, throw away
   keyboard focus, and churn the DOM for no reason. */
function paintRun(){
  const t = curTimer(), s = curSession(), m = activeMeeting();
  if (!t) return;
  const elapsed = elapsedMs(), remaining = t.durationMs - elapsed, phase = phaseFor(remaining);
  document.body.dataset.phase = phase;

  // Restraint rule: phase colour drives the numerals and the graphic only.
  const phaseVar = {idle:"var(--ink2)", running:"var(--go)", prewarn:"var(--warn)",
                    overrun:"var(--over)", ended:"var(--ink2)"}[phase];
  document.body.style.setProperty("--phase", run.state === "paused" ? "var(--ink2)" : phaseVar);

  const liveOver = Math.max(0, -remaining);
  const pool = sessionPool(s), used = (run.sessionUsed[s.id]||0) + liveOver, bufLeft = pool - used;
  // Only completed timers count toward drift; the live one contributes its
  // overrun only — time it has not used yet is not credit earned.
  const drift = run.records.reduce((a,r)=>a+r.varianceMs,0) + Math.max(0, elapsed - t.durationMs);
  $("runPills").innerHTML =
    '<span class="pill' + (bufLeft < 0 && pool > 0 ? " tint-over" : "") + '"><span class="k">Buffer</span>' +
      (pool === 0 ? "none set" : (bufLeft >= 0 ? fmt(bufLeft)+" left" : fmtSigned(bufLeft)+" over")) + '</span>' +
    '<span class="pill ' + (drift > 0 ? "tint-warn" : "tint-go") + '"><span class="k">Meeting drift</span>' +
      fmtSigned(drift) + '</span>';

  $("clock").textContent = remaining >= 0 ? fmt(remaining) : "+" + fmt(-remaining);

  activeRenderer.draw({ phase,
    remaining: remaining > 0 ? clamp(remaining/t.durationMs,0,1) : 0,
    overrun:  remaining <= 0 ? clamp((-remaining)/t.durationMs,0,1) : 0,
    color: phaseVar, reducedMotion: reducedMotion() });

  const nx = run.steps[run.index+1];
  $("runMeta").innerHTML =
    '<span>Planned ' + fmt(t.durationMs) + '</span><span class="sep">·</span>' +
    '<span>' + statusCopy(phase, remaining, bufLeft) + '</span><span class="sep">·</span>' +
    '<span>' + (nx ? "Next: " + esc(nx.timer.label) + ", " + fmt(nx.timer.durationMs)
                   : "Last timer of the meeting") + '</span>';
}
function renderRun(){
  const t = curTimer(), s = curSession(), m = activeMeeting();
  if (!t){
    $("runKicker").textContent = ""; $("runSession").textContent = "";
    $("runPills").innerHTML = ""; $("runNow").textContent = ""; $("runLabel").textContent = "";
    $("clock").textContent = "—";
    $("runMeta").innerHTML = '<span>' + (store.meetings.length
      ? 'No meeting loaded — press <b>H</b> for home and start one.'
      : 'Nothing to time yet — press <b>H</b> for home to build a meeting.') + '</span>';
    $("transport").innerHTML = '<button class="tbtn primary" data-go="home">Home<span class="sc">H</span></button>';
    document.body.dataset.phase = "idle";
    document.body.style.setProperty("--phase","var(--ink2)");
    return;
  }
  const sIdx = m ? m.sessions.indexOf(s) + 1 : 1;
  $("runKicker").textContent = "SESSION " + sIdx + " OF " + (m ? m.sessions.length : 1);
  $("runSession").textContent = s.title;
  $("runNow").textContent = "NOW SPEAKING";
  $("runLabel").textContent = t.label;

  const lbl = run.state === "running" ? "Pause" : run.state === "paused" ? "Resume" : "Start";
  $("transport").innerHTML =
    '<button class="tbtn primary" data-act="startPause">'+lbl+'<span class="sc">Space</span></button>' +
    '<button class="tbtn" data-act="reset"'+(run.state==="idle"?" disabled":"")+'>Reset<span class="sc">R</span></button>' +
    '<button class="tbtn" data-act="end"'+(run.state==="idle"||run.state==="ended"?" disabled":"")+'>End<span class="sc">E</span></button>' +
    '<button class="tbtn" data-act="next">'+(isLastStep()?"Finish":"Next")+'<span class="sc">N</span></button>' +
    '<button class="tbtn" data-go="build">Setup<span class="sc">S</span></button>' +
    '<button class="tbtn" data-go="home">Home<span class="sc">H</span></button>' +
    '<span class="tspacer"><span class="seg"><span class="lbl">Graphic</span>' +
      Object.keys(Renderers).map(k => '<button data-act="setRenderer" data-id="'+k+'" class="'+
        (store.settings.rendererId===k?"on":"")+'">'+Renderers[k].name+'</button>').join("") +
    '</span></span>';
  paintRun();
}
function loop(){
  if (run.state === "running"){ checkAlerts(elapsedMs()); if (view === "run") paintRun(); }
  else if (run.state === "paused" && view === "run") paintRun();
  requestAnimationFrame(loop);
}

function wireDnD(){
  document.querySelectorAll("[data-card]").forEach(c => {
    c.addEventListener("dragstart", (e) => {
      e.stopPropagation();
      dragItem = {kind:"timer", id:c.dataset.card};
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", c.dataset.card); } catch(err){}
    });
    c.addEventListener("dragend", () => { dragItem = null;
      document.querySelectorAll(".col").forEach(x => x.classList.remove("dragover")); });
  });
  document.querySelectorAll("[data-col]").forEach(col => {
    col.addEventListener("dragstart", (e) => {
      if (dragItem) return;                       // a card started this drag
      dragItem = {kind:"session", id:col.dataset.col};
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", col.dataset.col); } catch(err){}
    });
    col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("dragover"); });
    col.addEventListener("dragleave", () => col.classList.remove("dragover"));
    col.addEventListener("drop", (e) => {
      e.preventDefault(); col.classList.remove("dragover");
      if (!dragItem) return;
      const m = activeMeeting(); if (!m) return;
      if (dragItem.kind === "timer"){
        const from = findTimerOf(dragItem.id), to = findSessionOf(col.dataset.col);
        if (from && to){
          from.s.timers = from.s.timers.filter(x => x.id !== dragItem.id);
          const overCard = e.target.closest ? e.target.closest("[data-card]") : null;
          const idx = overCard ? to.s.timers.findIndex(x => x.id === overCard.dataset.card) : -1;
          if (idx >= 0) to.s.timers.splice(idx, 0, from.t); else to.s.timers.push(from.t);
          recomputeSessionPlanned(from.s); recomputeSessionPlanned(to.s);
        }
      } else {
        const a = m.sessions.findIndex(x => x.id === dragItem.id);
        const b = m.sessions.findIndex(x => x.id === col.dataset.col);
        if (a >= 0 && b >= 0 && a !== b){ const [mv] = m.sessions.splice(a,1); m.sessions.splice(b,0,mv); }
      }
      dragItem = null; save(); buildSteps(activeMeeting()); renderBuild();
    });
  });
}

/* ==========================================================================
   HISTORY
   ========================================================================== */
function groupBy(arr, fn){ const o = {}; arr.forEach(x => { const k = fn(x); (o[k]=o[k]||[]).push(x); }); return o; }
const statCard = (k,v,s,cls) => '<div class="card stat"><div class="k">'+k+'</div>' +
  '<div class="v '+(cls||"")+'">'+v+'</div><div class="s">'+s+'</div></div>';

function renderHistory(){
  const el = $("histBody"), hist = store.history;
  if (!hist.length){
    el.innerHTML = '<div class="page-h"><h1>History</h1></div>' +
      '<div class="blank"><h3>No runs recorded yet</h3>' +
      '<p>Every timer you run writes a row here: planned against actual, variance, and time spent paused. ' +
      'Drift rolls up by timer label, by session and by meeting — so you can see whether delays come from ' +
      'one person, one kind of session, or the meeting as a whole.</p>' +
      '<div class="acts"><button class="btn primary" data-go="home">Start a meeting</button></div></div>';
    return;
  }
  const byRun = groupBy(hist, r => r.runId);
  const runsAll = Object.keys(byRun)
    .sort((a,b) => new Date(byRun[a][0].date) - new Date(byRun[b][0].date))
    .map(k => byRun[k]);
  const drifts = runsAll.map(rows => rows.reduce((a,r)=>a+r.varianceMs,0));
  const pauses = runsAll.map(rows => rows.reduce((a,r)=>a+(r.pausedMs||0),0));
  const avgDrift = Math.round(drifts.reduce((a,b)=>a+b,0)/drifts.length);
  const avgPaused = Math.round(pauses.reduce((a,b)=>a+b,0)/pauses.length);
  const onPlan = Math.round(100 * hist.filter(r => r.varianceMs <= 0).length / hist.length);
  const totalOver = hist.reduce((a,r)=>a+Math.max(0,r.varianceMs),0);
  const totalPool = store.meetings.reduce((a,m)=>a+m.sessions.reduce((b,s)=>b+sessionPool(s),0),0);
  const bufUsed = totalPool ? Math.min(999, Math.round(100*totalOver/totalPool)) : 0;

  let h = '<div class="page-h"><h1>History</h1><p>' + runsAll.length + ' meeting' +
    (runsAll.length===1?"":"s") + ' recorded on this browser. Drift is time over plan; paused time is kept ' +
    'separate, because a break isn\'t anyone\'s fault.</p></div>';

  h += '<div class="grid stats" style="margin-bottom:var(--s5)">' +
    statCard("Meeting drift", fmtSigned(avgDrift), "avg over " + runsAll.length + " meetings", avgDrift>0?"over":"go") +
    statCard("Paused time", fmt(avgPaused), "avg, tracked separately", "") +
    statCard("Buffer used", bufUsed + "%", "of pooled buffer", "") +
    statCard("On plan", onPlan + "%", "of timers finished inside plan", onPlan>=60?"go":"warn") + '</div>';

  h += '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-bottom:var(--s5)">';

  const byLabel = groupBy(hist, r => r.timerLabel);
  const labels = Object.keys(byLabel)
    .map(k => ({k, avg:Math.round(byLabel[k].reduce((a,r)=>a+r.varianceMs,0)/byLabel[k].length)}))
    .sort((a,b) => b.avg - a.avg).slice(0,10);
  const maxAbs = Math.max(1, ...labels.map(x => Math.abs(x.avg)));
  h += '<div class="card"><div class="panel-h">Drift by timer label</div>' +
    '<p class="muted" style="font-size:13px;margin:4px 0 var(--s4)">Average variance per run, all meetings</p><div class="bars">';
  labels.forEach(x => {
    const w = Math.round(100*Math.abs(x.avg)/maxAbs);
    const col = x.avg <= 0 ? "var(--go)" : (x.avg > 120000 ? "var(--over)" : "var(--warn)");
    h += '<div class="barrow"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(x.k) + '</div>' +
      '<div class="bartrack"><div class="barfill" style="width:'+w+'%;background:'+col+'"></div></div>' +
      '<div class="num" style="color:'+col+'">' + fmtSigned(x.avg) + '</div></div>';
  });
  h += '</div></div>';

  const last12 = runsAll.slice(-12), d12 = drifts.slice(-12), p12 = pauses.slice(-12);
  const mx = Math.max(1, ...d12.map(Math.abs), ...p12);
  h += '<div class="card"><div class="panel-h">Meeting drift over time</div>' +
    '<p class="muted" style="font-size:13px;margin:4px 0 var(--s3)">Last ' + last12.length +
    ' meetings · drift above the line, paused time below</p><div class="chart">';
  last12.forEach((rows, i) => {
    const dH = Math.round(100*Math.abs(d12[i])/mx), pH = Math.round(100*p12[i]/mx);
    const col = d12[i] <= 0 ? "var(--go)" : (d12[i] > 300000 ? "var(--over)" : "var(--warn)");
    h += '<div class="colw" title="' + esc(rows[0].meetingTitle) + ' — drift ' + fmtSigned(d12[i]) +
      ', paused ' + fmt(p12[i]) + '">' +
      '<div class="up"><div class="b" style="height:'+Math.max(2,dH)+'%;background:'+col+'"></div></div>' +
      '<div class="hair"></div>' +
      '<div class="dn"><div class="b down" style="height:'+Math.max(2,pH)+'%"></div></div></div>';
  });
  h += '</div></div></div>';

  const lastRun = runsAll[runsAll.length-1];
  h += '<div class="card"><div class="panel-h">Run log — ' +
    esc(new Date(lastRun[0].date).toLocaleDateString(undefined,{day:"numeric",month:"long"})) + ', ' +
    esc(lastRun[0].meetingTitle) + '</div>' +
    '<table class="t" style="margin-top:var(--s3)"><thead><tr><th>Timer</th><th>Planned</th><th>Actual</th>' +
    '<th>Variance</th><th>Paused</th></tr></thead><tbody>';
  lastRun.forEach(r => {
    const big = Math.abs(r.varianceMs) > 120000;
    h += '<tr><td>' + esc(r.timerLabel) + '</td><td>' + fmt(r.plannedMs) + '</td><td>' + fmt(r.actualMs) + '</td>' +
      '<td class="' + (r.varianceMs>0 ? (big?"over":"warn") : "go") + '">' + fmtSigned(r.varianceMs) + '</td>' +
      '<td class="muted">' + fmt(r.pausedMs||0) + '</td></tr>';
  });
  h += '</tbody></table></div>' +
    '<div class="inline" style="margin-top:var(--s4)">' +
    '<button class="btn ghost" data-act="exportCSV">Export CSV</button>' +
    '<button class="btn danger" data-act="clearHistory">Clear history</button></div>';
  el.innerHTML = h;
}

   DATA — backup, transfer, appearance

function exportJSON(){
  downloadFile("forum-timer-" + stamp() + ".json", JSON.stringify({
    app:"forum-timer", schema:2, appVersion:APP_VERSION, exportedAt:new Date().toISOString(),
    library:store.library, meetings:store.meetings, history:store.history, settings:store.settings,
  }, null, 2), "application/json");
  toast("Backup exported.");
}
const csvCell = (v) => { const s = String(v==null?"":v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
function exportCSV(){
  if (!store.history.length){ toast("No history to export yet.", {warn:true}); return; }
  const secs = (ms) => (ms/1000).toFixed(1);
  const head = ["date","meeting","session","timer","planned_s","actual_s","variance_s","paused_s"];
  const rows = store.history.map(r => [new Date(r.date).toISOString(), r.meetingTitle, r.sessionTitle,
    r.timerLabel, secs(r.plannedMs), secs(r.actualMs), secs(r.varianceMs), secs(r.pausedMs||0)]);
  downloadFile("forum-timer-history-" + stamp() + ".csv",
    [head,...rows].map(r => r.map(csvCell).join(",")).join("\r\n") + "\r\n", "text/csv");
  toast("History exported as CSV.");
}
function validateImport(o){
  if (!o || typeof o !== "object") return "That file is not valid JSON.";
  if (o.app && o.app !== "forum-timer") return "That backup is from a different app.";
  for (const k of ["library","meetings","history"])
    if (o[k] != null && !Array.isArray(o[k])) return "Backup field '" + k + "' is malformed.";
  if (!o.library && !o.meetings && !o.history) return "No timers, meetings or history found in that file.";
  return null;
}
const reidSession = (s) => { s.id = uid(); s.timers.forEach(t => t.id = uid()); };
const reid = (m) => { m.id = uid(); m.sessions.forEach(reidSession); };
function applyImport(o, mode){
  const inc = { library:o.library||[], meetings:o.meetings||[], history:o.history||[] };
  if (mode === "replace"){
    store.library = inc.library; store.meetings = inc.meetings; store.history = inc.history;
    if (o.settings && typeof o.settings === "object"){
      if (o.settings.rendererId in Renderers) store.settings.rendererId = o.settings.rendererId;
      store.settings.activeMeetingId = o.settings.activeMeetingId || null;
    }
  } else {
    const libIds = new Set(store.library.map(x => x.id));
    inc.library.forEach(t => { const c = JSON.parse(JSON.stringify(t)); if (libIds.has(c.id)) c.id = uid(); store.library.push(c); });
    const mIds = new Set(store.meetings.map(x => x.id));
    inc.meetings.forEach(m => { const c = JSON.parse(JSON.stringify(m)); if (mIds.has(c.id)) reid(c); store.meetings.push(c); });
    const hIds = new Set(store.history.map(x => x.id));
    inc.history.forEach(r => { if (!hIds.has(r.id)) store.history.push(r); });
  }
  store = migrate(store);
  store.history.sort((a,b) => new Date(a.date) - new Date(b.date));
  save(); mountRenderer(); loadMeetingIntoRun(activeMeeting(), false);
  toast((mode==="replace" ? "Replaced with " : "Merged in ") +
    (inc.meetings.length + inc.library.length + inc.history.length) + " records.");
  go(view);
}
function handleImportFile(file){
  const rd = new FileReader();
  rd.onerror = () => toast("Could not read that file.", {warn:true});
  rd.onload = () => {
    let o = null;
    try { o = JSON.parse(rd.result); } catch(e){ toast("That file is not valid JSON.", {warn:true}); return; }
    const err = validateImport(o); if (err){ toast(err, {warn:true}); return; }
    openModal('<h2>Import backup</h2><p class="hint">Found ' + ((o.meetings||[]).length) + ' meetings, ' +
      ((o.library||[]).length) + ' library timers, ' + ((o.history||[]).length) + ' history rows.</p>' +
      '<p class="hint"><b>Merge</b> keeps what you have and adds the incoming records. ' +
      '<b>Replace</b> discards everything currently in this browser.</p>' +
      '<div class="modal-actions"><button class="btn ghost" data-act="closeModal">Cancel</button>' +
      '<button class="btn" id="imp_merge">Merge</button>' +
      '<button class="btn primary" id="imp_replace">Replace all</button></div>');
    $("imp_merge").onclick = () => { closeModal(); applyImport(o,"merge"); };
    $("imp_replace").onclick = () => {
      if (confirm("Replace ALL meetings, timers and history in this browser?")){ closeModal(); applyImport(o,"replace"); }
    };
  };
  rd.readAsText(file);
}

function reportSWState(){

      : navigator.serviceWorker.controller ? "ready — works with no internet"
      : "registered — reload once to activate";

function renderSummary(){
  const el = $("sumBody"), m = activeMeeting(), recs = run.records;
  const pln = recs.reduce((a,r)=>a+r.plannedMs,0);
  const act = recs.reduce((a,r)=>a+r.actualMs,0);
  const pau = recs.reduce((a,r)=>a+(r.pausedMs||0),0);
  const drift = act - pln;
  let h = '<div class="page-h" style="text-align:center">' +
    '<div class="kicker go">MEETING COMPLETE</div>' +
    '<h1 style="font-size:40px;margin-top:8px">' + esc(m ? m.title : "Meeting") + '</h1>' +
    '<p style="margin-left:auto;margin-right:auto">' + recs.length + ' of ' + run.steps.length + ' timers run' +
      (recs.length < run.steps.length ? ' · ' + (run.steps.length-recs.length) + ' skipped' : '') + '</p></div>';

  h += '<div class="inline" style="justify-content:center;margin-bottom:var(--s5)">' +
    '<button class="btn primary" data-go="home">Back to home</button>' +
    '<button class="btn" data-act="runAgain">Run again</button>' +
    '<button class="btn ghost" data-go="history">Full history</button></div>';

  h += '<div class="grid stats" style="margin-bottom:var(--s5)">' +
    statCard("Target", m ? fmt(m.targetTotalMs) : "—", "planned for the meeting", "") +
    statCard("Actual", fmt(act), "time on the clock", "") +
    statCard("Drift", fmtSigned(drift), "against the timers run", drift>0?"over":"go") +
    statCard("Paused", fmt(pau), "tracked separately", "") + '</div>';

  if (!recs.length){
    el.innerHTML = h + '<div class="blank"><h3>Nothing to report</h3><p>No timers were run in this pass.</p></div>';
    return;
  }
  const bySession = groupBy(recs, r => r.sessionId);
  (m ? m.sessions.filter(s => bySession[s.id]) : []).forEach(s => {
    const rows = bySession[s.id];
    const a2 = rows.reduce((a,r)=>a+r.actualMs,0), p2 = rows.reduce((a,r)=>a+r.plannedMs,0);
    const pz = rows.reduce((a,r)=>a+(r.pausedMs||0),0), d2 = a2 - p2;
    const pool = sessionPool(s), used = rows.reduce((a,r)=>a+Math.max(0,r.varianceMs),0), left = pool - used;
    h += '<div class="card" style="margin-bottom:var(--s3)"><div class="row-between" style="align-items:center">' +
      '<div><div style="font-weight:700;font-size:17px">' + esc(s.title) + '</div>' +
      '<div class="muted" style="font-size:13px">planned ' + fmt(p2) + ' · actual ' + fmt(a2) + ' · paused ' + fmt(pz) + '</div></div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
        '<span class="pill ' + (d2>0?"tint-warn":"tint-go") + '"><span class="k">drift</span>' + fmtSigned(d2) + '</span>' +
        '<span class="pill' + (left<0&&pool>0?" tint-over":"") + '"><span class="k">buffer</span>' +
          (pool===0 ? "none" : (left>=0 ? fmt(left)+" left" : fmtSigned(left)+" over")) + '</span></div></div>' +
      '<table class="t" style="margin-top:var(--s3)"><thead><tr><th>Timer</th><th>Planned</th><th>Actual</th>' +
      '<th>Variance</th><th>Paused</th></tr></thead><tbody>';
    rows.forEach(r => {
      h += '<tr><td>' + esc(r.timerLabel) + '</td><td>' + fmt(r.plannedMs) + '</td><td>' + fmt(r.actualMs) + '</td>' +
        '<td class="' + (r.varianceMs>0?"over":"go") + '">' + fmtSigned(r.varianceMs) + '</td>' +
        '<td class="muted">' + fmt(r.pausedMs||0) + '</td></tr>';
    });
    h += '</tbody></table></div>';
  });
  el.innerHTML = h;
}

      '<div class="field" style="width:170px"><label>Buffer before (min)</label>' +
        '<input type="number" id="sm_bm" min="0" max="600" value="'+bb.m+'"></div>' +
      '<div class="field" style="width:120px"><label>sec</label>' +
        '<input type="number" id="sm_bs" min="0" max="59" value="'+bb.s+'"></div></div>' +
    '<div class="inline">' +
      '<div class="field" style="width:170px"><label>Buffer after (min)</label>' +
        '<input type="number" id="sm_am" min="0" max="600" value="'+ba.m+'"></div>' +
      '<div class="field" style="width:120px"><label>sec</label>' +
        '<input type="number" id="sm_as" min="0" max="59" value="'+ba.s+'"></div></div>' +
    '<div class="modal-actions"><button class="btn ghost" data-act="closeModal">Cancel</button>' +
    '<button class="btn primary" id="sm_ok">Save</button></div>');
  $("sm_ok").onclick = () => {
    s.title = $("sm_t").value.trim() || "Session";
    s.bufferBeforeMs = ((clamp(parseInt($("sm_bm").value,10)||0,0,600))*60 + (clamp(parseInt($("sm_bs").value,10)||0,0,59)))*1000;
    s.bufferAfterMs  = ((clamp(parseInt($("sm_am").value,10)||0,0,600))*60 + (clamp(parseInt($("sm_as").value,10)||0,0,59)))*1000;
    closeModal(); onSave();
  };
}
function libPicker(onPick){
  let h = '<h2>Add from library</h2>';
  if (!store.library.length) h += '<p class="hint">The library is empty. Add timers in the Library tab first.</p>';
  store.library.forEach(t => {
    h += '<div class="tcard"><span class="body"><span class="lab">' + esc(t.label) + '</span></span>' +
      '<span class="dur">' + fmt(t.durationMs) + '</span>' +
      '<button class="btn primary sm" data-pick="' + t.id + '">Add</button></div>';
  });
  h += '<div class="modal-actions"><button class="btn ghost" data-act="closeModal">Close</button></div>';
  openModal(h);
  $("modal").querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
    const t = store.library.find(x => x.id === b.dataset.pick); closeModal(); if (t) onPick(t);
  });
}
function move(arr, item, dir){
  const i = arr.indexOf(item), j = i + dir;
  if (i < 0 || j < 0 || j >= arr.length) return;
  arr.splice(i,1); arr.splice(j,0,item);
}

/* ==========================================================================
   ACTIONS
   ========================================================================== */
document.addEventListener("click", (e) => {
  const nav = e.target.closest("[data-go]");
  if (nav){ go(nav.dataset.go); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, dir = parseInt(el.dataset.dir,10);

  switch(act){
    case "closeModal": closeModal(); break;

    case "startPause": toggleStartPause(); break;
    case "reset": resetTimer(); renderRun(); break;
    case "end": endTimer(); break;
    case "next": nextTimer(); break;
    case "runAgain": run.index = 0; run.sessionUsed = {}; run.records = []; run.runId = uid();
      resetTimer(); go("run"); break;

    case "newMeeting": { const m = newMeeting("New meeting"); store.meetings.push(m); save();
      loadMeetingIntoRun(m, false); meetingModal(m, () => { save(); go("build"); }); break; }
    case "startMeeting": loadMeetingIntoRun(findMeeting(id), true); break;
    case "openBuild": loadMeetingIntoRun(findMeeting(id), false); go("build"); break;
    case "editMeetingProps": meetingModal(findMeeting(id), () => { save(); go(view); }); break;
    case "dupMeeting": { const src = findMeeting(id), c = JSON.parse(JSON.stringify(src));
      reid(c); c.title = src.title + " (copy)"; c.pausedTotalMs = 0; store.meetings.push(c); save(); go(view); break; }
    case "delMeeting": { if (!confirm("Delete this meeting? Its history stays.")) break;
      store.meetings = store.meetings.filter(x => x.id !== id);
      if (store.settings.activeMeetingId === id) loadMeetingIntoRun(store.meetings[0]||null, false);
      save(); go(view); break; }

    case "newSession": { const m = findMeeting(id), s = newSession("New session");
      m.sessions.push(s); save(); buildSteps(activeMeeting());
      sessionModal(s, () => { save(); renderBuild(); }); break; }
    case "editSessionProps": { const f = findSessionOf(id); sessionModal(f.s, () => { save(); renderBuild(); }); break; }
    case "dupSession": { const f = findSessionOf(id), c = JSON.parse(JSON.stringify(f.s));
      reidSession(c); c.title = f.s.title + " (copy)";
      f.m.sessions.splice(f.m.sessions.indexOf(f.s)+1, 0, c);
      save(); buildSteps(activeMeeting()); renderBuild(); break; }
    case "delSession": { const f = findSessionOf(id); if (!confirm("Delete this session and its timers?")) break;
      f.m.sessions = f.m.sessions.filter(x => x.id !== id);
      save(); buildSteps(activeMeeting()); renderBuild(); break; }
    case "moveSession": { const f = findSessionOf(id); move(f.m.sessions, f.s, dir);
      save(); buildSteps(activeMeeting()); renderBuild(); break; }

    case "addTimerTo": { const f = findSessionOf(id), t = newTimer("New timer", 10, 0);
      f.s.timers.push(t); recomputeSessionPlanned(f.s); save(); buildSteps(activeMeeting());
      openTimerEditor({t, s:f.s, m:f.m}); break; }
    case "addFromLib": { const f = findSessionOf(id); libPicker(def => {
      f.s.timers.push(cloneTimer(def)); recomputeSessionPlanned(f.s); save();
      buildSteps(activeMeeting()); renderBuild(); }); break; }
    case "editTimer": { const f = findTimerOf(id); openTimerEditor({t:f.t, s:f.s, m:f.m}); break; }
    case "delTimer": { const f = findTimerOf(id); f.s.timers = f.s.timers.filter(x => x.id !== id);
      recomputeSessionPlanned(f.s); save(); buildSteps(activeMeeting()); renderBuild(); break; }
    case "moveTimer": { const f = findTimerOf(id); move(f.s.timers, f.t, dir);
      save(); buildSteps(activeMeeting()); renderBuild(); break; }

    case "preview": if (editRef && editRef.t) playSound($("ed_s_" + id).value); break;
    case "saveTimerEdit": readTimerEditor(); buildSteps(activeMeeting());
      toast("Timer saved."); go(editRef.lib ? "library" : "build"); break;
    case "backFromAlerts": go(editRef && editRef.lib ? "library" : "build"); break;
    case "saveToLib": readTimerEditor(); store.library.push(cloneTimer(editRef.t)); save();
      toast("Saved to the library."); break;

    case "newLibTimer": { const t = newTimer("New timer", 10, 0); store.library.push(t); save();
      openTimerEditor({t, lib:true}); break; }
    case "editLibTimer": openTimerEditor({t:store.library.find(x => x.id === id), lib:true}); break;
    case "dupLibTimer": { const t = store.library.find(x => x.id === id), c = cloneTimer(t);
      c.label = t.label + " (copy)"; store.library.push(c); save(); renderLibrary(); break; }
    case "delLibTimer": if (!confirm("Delete this library timer?")) break;
      store.library = store.library.filter(x => x.id !== id); save(); renderLibrary(); break;

    case "setRenderer": store.settings.rendererId = id; save(); mountRenderer();
      if (view === "run") renderRun(); else renderData(); break;
    case "setTheme": store.settings.theme = id; save(); applyTheme(); renderData(); break;
    case "setRoom": store.settings.roomMode = (id === "on"); save(); applyTheme(); renderData(); break;

    case "exportJSON": exportJSON(); break;
    case "exportCSV": exportCSV(); break;
    case "importJSON": $("importFile").click(); break;
    case "reseedSample": { const fresh = seed();
      fresh.library.forEach(t => store.library.push(t));
      fresh.meetings.forEach(m => store.meetings.push(m));
      save(); loadMeetingIntoRun(store.meetings[store.meetings.length-1], false);
      toast("Sample meeting added."); go(view); break; }
    case "clearHistory": if (!confirm("Clear all run history and reset paused totals?")) break;
      store.history = []; store.meetings.forEach(m => m.pausedTotalMs = 0); save(); go(view); break;
    case "factoryReset":
      if (!confirm("Erase all meetings, library timers and history in this browser?")) break;
      if (!confirm("Last check — this cannot be undone. Continue?")) break;
      store = seed(); save(); applyTheme(); mountRenderer(); loadMeetingIntoRun(activeMeeting(), false);
      toast("Everything erased and reseeded."); go("home"); break;
  }
});

/* ==========================================================================
   WIRING
   ========================================================================== */
$("themeBtn").addEventListener("click", () => {
  store.settings.theme = document.body.dataset.theme === "dark" ? "light" : "dark";
  save(); applyTheme(); if (view === "data") renderData();
});
$("notes").addEventListener("input", (e) => { const m = activeMeeting(); if (!m) return; m.notes = e.target.value; save(); });
$("importFile").addEventListener("change", (e) => {
  const f = e.target.files && e.target.files[0]; e.target.value = ""; if (f) handleImportFile(f);
});
$("overlay").addEventListener("mousedown", (e) => { if (e.target === $("overlay")) closeModal(); });
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (store.settings.theme === "auto") applyTheme();
});

document.addEventListener("keydown", (e) => {
  if ($("overlay").classList.contains("open")){ if (e.key === "Escape"){ e.preventDefault(); closeModal(); } return; }
  const tag = (e.target.tagName||"").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea"){ if (e.key === "Escape") e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  switch(e.key){
    case "h": case "H": e.preventDefault(); go("home"); break;
    case "s": case "S": e.preventDefault(); go("build"); break;
    case " ": case "Spacebar": if (view !== "run") return; e.preventDefault(); toggleStartPause(); break;
    case "r": case "R": if (view !== "run") return; e.preventDefault(); resetTimer(); renderRun(); break;
    case "e": case "E": if (view !== "run") return; e.preventDefault(); endTimer(); break;
    case "n": case "N":
      if (view === "summary"){ e.preventDefault(); go("home"); return; }
      if (view !== "run") return; e.preventDefault(); nextTimer(); break;
    case "Escape": if (view === "summary"){ e.preventDefault(); go("home"); } break;
  }
});

/* ==========================================================================
   SERVICE WORKER (optional sidecar)
   ========================================================================== */
function registerSW(){
  if (location.protocol === "file:" || !("serviceWorker" in navigator)) return;
  navigator.serviceWorker.register("sw.js").then(reg => {
    const offer = (w) => toast("A new version is ready.", { sticky:true, actionLabel:"Reload",
      onAction: () => { w.postMessage("skipWaiting"); location.reload(); } });
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener("updatefound", () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener("statechange", () => {
        if (w.state === "installed" && navigator.serviceWorker.controller) offer(w);
      });
    });
    reportSWState();
  }).catch(() => {});
}

/* ==========================================================================
   INIT — always lands on Home, never straight into a running meeting
   ========================================================================== */
load();
applyTheme();
mountRenderer();
buildSteps(activeMeeting());
run.runId = uid();
go("home");
requestAnimationFrame(loop);
registerSW();
</script>
