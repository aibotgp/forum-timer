<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forum Timer</title>
<style>
  /* ---- Theme / state colours (carried across the whole field) ---- */
  :root {
    --bg: #14161a;
    --fg: #f2f4f7;
    --muted: #8a93a2;
    --bar-track: rgba(255,255,255,0.08);
    --accent: #3ecf7a;          /* running (green)   */
    --accent-warn: #f4b740;     /* pre-warning (amber) */
    --accent-over: #ff4d4d;     /* overrun (red)     */
    --field: var(--bg);
    --bar: var(--accent);
    --ink: var(--fg);
    --transition: 240ms ease;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "Helvetica Neue", Arial, sans-serif;
    background: var(--field);
    color: var(--ink);
    transition: background-color var(--transition), color var(--transition);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* whole-field colour by state */
  body[data-phase="idle"]    { --field: #14161a; --bar: var(--muted); --ink: #f2f4f7; }
  body[data-phase="running"] { --field: #0e1a12; --bar: var(--accent); --ink: #eafff1; }
  body[data-phase="prewarn"] { --field: #201a0a; --bar: var(--accent-warn); --ink: #fff6e2; }
  body[data-phase="overrun"] { --field: #240d0d; --bar: var(--accent-over); --ink: #ffe9e9; }
  body[data-phase="ended"]   { --field: #16181c; --bar: var(--muted); --ink: #c7cdd6; }
  body[data-paused="true"]   { --field: #0f1114; --ink: #aab2bf; }

  .stage {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: clamp(16px, 3vw, 40px);
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
  }
  .label {
    font-size: clamp(20px, 4vw, 44px);
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--ink);
    opacity: 0.92;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .status {
    font-size: clamp(13px, 1.6vw, 20px);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--bar);
    white-space: nowrap;
  }

  /* ---- The hero numerals ---- */
  .clock-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .clock {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    font-weight: 800;
    line-height: 0.9;
    letter-spacing: -0.02em;
    color: var(--ink);
    font-size: min(38vw, 34vh);
    text-align: center;
    transition: color var(--transition);
  }
  .clock .sign { font-weight: 700; }

  body[data-phase="overrun"] .clock {
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.72; }
  }

  /* ---- Depletion bar ---- */
  .bar-track {
    height: clamp(22px, 4vh, 54px);
    background: var(--bar-track);
    border-radius: 6px;
    overflow: hidden;
    margin: clamp(10px, 2vh, 24px) 0;
    position: relative;
  }
  .bar-fill {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    left: 0;
    background: var(--bar);
    transform-origin: right center;   /* drains left→right, refills from the right */
    transform: scaleX(1);
    transition: transform 120ms linear, background-color var(--transition);
  }

  /* ---- Transport controls (always visible) ---- */
  .transport {
    display: flex;
    gap: clamp(8px, 1.5vw, 16px);
    justify-content: center;
    flex-wrap: wrap;
  }
  button.ctl {
    font: inherit;
    font-weight: 650;
    font-size: clamp(15px, 2vw, 22px);
    color: var(--fg);
    background: rgba(255,255,255,0.07);
    border: 1.5px solid rgba(255,255,255,0.16);
    border-radius: 12px;
    padding: clamp(10px, 1.6vh, 18px) clamp(18px, 3vw, 34px);
    cursor: pointer;
    transition: background-color 120ms ease, border-color 120ms ease, transform 60ms ease;
    min-width: clamp(96px, 12vw, 150px);
  }
  button.ctl:hover { background: rgba(255,255,255,0.13); }
  button.ctl:active { transform: translateY(1px); }
  button.ctl.primary {
    background: var(--bar);
    color: #0b0d10;
    border-color: transparent;
  }
  button.ctl:disabled { opacity: 0.34; cursor: default; }
  button.ctl .key {
    font-size: 0.62em;
    opacity: 0.6;
    margin-left: 8px;
    font-weight: 600;
  }

  :focus-visible {
    outline: 3px solid #7db4ff;
    outline-offset: 3px;
    border-radius: 12px;
  }

  /* ---- Setup overlay ---- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(6,7,9,0.72);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .overlay.open { display: flex; }
  .panel {
    background: #1b1e24;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    padding: clamp(20px, 3vw, 34px);
    width: min(560px, 100%);
    max-height: 92vh;
    overflow-y: auto;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }
  .panel h2 { margin: 0 0 6px; font-size: 24px; }
  .panel .hint { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
    margin-bottom: 18px;
  }
  .row label { font-size: 14px; font-weight: 600; color: #cfd5de; }
  .row .sub { font-size: 12.5px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: end; }
  input[type="text"], input[type="number"], select {
    font: inherit;
    font-size: 16px;
    background: #0f1116;
    color: var(--fg);
    border: 1.5px solid rgba(255,255,255,0.16);
    border-radius: 10px;
    padding: 11px 13px;
    width: 100%;
  }
  fieldset {
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 14px 16px 4px;
    margin: 0 0 16px;
  }
  fieldset legend { padding: 0 8px; font-weight: 700; font-size: 14px; color: #dfe4ea; }
  .panel-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 8px; }
  .btn {
    font: inherit; font-weight: 650; font-size: 16px;
    border-radius: 11px; padding: 12px 22px; cursor: pointer;
    border: 1.5px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.06); color: var(--fg);
  }
  .btn.save { background: var(--accent); color: #08120b; border-color: transparent; }

  .hintbar {
    text-align: center;
    color: var(--muted);
    font-size: clamp(11px, 1.4vw, 14px);
    margin-top: 12px;
    letter-spacing: 0.3px;
  }
  .hintbar kbd {
    font-family: inherit;
    background: rgba(255,255,255,0.09);
    border-radius: 5px;
    padding: 1px 6px;
    margin: 0 1px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    body[data-phase="overrun"] .clock { animation: none; }
    .bar-fill { transition: none; }
  }
</style>
</head>
<body data-phase="idle" data-paused="false">
  <div class="stage">
    <header>
      <div class="label" id="labelText">Timer</div>
      <div class="status" id="statusText">Ready</div>
    </header>

    <div class="clock-wrap">
      <div class="clock" id="clock">05:00</div>
    </div>

    <div class="bar-track">
      <div class="bar-fill" id="barFill"></div>
    </div>

    <div class="transport">
      <button class="ctl primary" id="btnStart">Start<span class="key">Space</span></button>
      <button class="ctl" id="btnReset" disabled>Reset<span class="key">R</span></button>
      <button class="ctl" id="btnEnd" disabled>End<span class="key">E</span></button>
      <button class="ctl" id="btnSetup">Setup<span class="key">S</span></button>
    </div>

    <div class="hintbar">
      <kbd>Space</kbd> start / pause &nbsp;·&nbsp;
      <kbd>R</kbd> reset &nbsp;·&nbsp;
      <kbd>E</kbd> end &nbsp;·&nbsp;
      <kbd>S</kbd> setup
    </div>
  </div>

  <!-- ---- Setup overlay ---- -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Timer setup">
    <div class="panel">
      <h2>Timer setup</h2>
      <p class="hint">Configure the timer and its three alerts. Set any sound to <em>None</em> to mute that alert.</p>

      <div class="row">
        <label for="fLabel">Label</label>
        <input type="text" id="fLabel" maxlength="60" placeholder="e.g. Member Check-in">
      </div>

      <div class="row">
        <label>Planned duration</label>
        <div class="grid2">
          <div>
            <input type="number" id="fMin" min="0" max="600" step="1"> <span class="sub">minutes</span>
          </div>
          <div>
            <input type="number" id="fSec" min="0" max="59" step="1"> <span class="sub">seconds</span>
          </div>
        </div>
      </div>

      <fieldset>
        <legend>Pre-warning</legend>
        <div class="grid3">
          <div class="row" style="margin:0 0 12px;">
            <label for="fPreN">Fires at … seconds remaining</label>
            <input type="number" id="fPreN" min="1" max="3600" step="1">
          </div>
          <div class="row" style="margin:0 0 12px;">
            <label for="fPreSound">Sound</label>
            <select id="fPreSound"></select>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Time up (at zero)</legend>
        <div class="row" style="margin:0 0 12px;">
          <label for="fUpSound">Sound</label>
          <select id="fUpSound"></select>
        </div>
      </fieldset>

      <fieldset>
        <legend>Overrun repeat</legend>
        <div class="grid3">
          <div class="row" style="margin:0 0 12px;">
            <label for="fOverN">Repeats every … seconds past zero</label>
            <input type="number" id="fOverN" min="1" max="3600" step="1">
          </div>
          <div class="row" style="margin:0 0 12px;">
            <label for="fOverSound">Sound</label>
            <select id="fOverSound"></select>
          </div>
        </div>
      </fieldset>

      <div class="panel-actions">
        <button class="btn" id="btnCancel">Cancel</button>
        <button class="btn save" id="btnSave">Save</button>
      </div>
    </div>
  </div>

<script>
"use strict";

/* =========================================================================
   Forum Timer — Phase 1
   Single timer engine, three alerts, overrun, state colours.
   Time is computed from Date.now() timestamps (never by counting ticks),
   so the clock stays accurate even when the tab is throttled.
   ========================================================================= */

// ---- Sound library (synthesised, no audio files) --------------------------
const SOUNDS = {
  none:  { name: "None" },
  soft:  { name: "Soft" },
  beep:  { name: "Beep" },
  chime: { name: "Chime" },
  bell:  { name: "Bell" },
  alarm: { name: "Alarm" },
  buzz:  { name: "Buzz" },
};

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
}

function tone(freq, startOffset, dur, type, peak) {
  const t0 = audioCtx.currentTime + startOffset;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}

function playSound(id) {
  if (!id || id === "none") return;
  ensureAudio();
  if (!audioCtx) return;
  switch (id) {
    case "soft":  tone(523.25, 0, 0.45, "sine", 0.28); break;
    case "beep":  tone(880, 0, 0.16, "square", 0.22); break;
    case "chime": tone(659.25, 0, 0.28, "sine", 0.3); tone(987.77, 0.16, 0.42, "sine", 0.28); break;
    case "bell":  tone(784, 0, 0.9, "triangle", 0.32); tone(1568, 0, 0.5, "sine", 0.12); break;
    case "alarm": tone(1150, 0, 0.12, "square", 0.28); tone(1150, 0.2, 0.12, "square", 0.28); tone(1150, 0.4, 0.12, "square", 0.28); break;
    case "buzz":  tone(150, 0, 0.55, "sawtooth", 0.24); break;
  }
}

// ---- Timer configuration & state -----------------------------------------
const config = {
  label: "Timer",
  durationMs: 5 * 60 * 1000,
  preWarn:  { n: 30, sound: "chime" },  // n = seconds remaining
  timeUp:   { sound: "bell" },
  overrun:  { n: 15, sound: "alarm" },  // n = seconds between repeats
};

const timer = {
  state: "idle",          // idle | running | paused | ended
  startEpoch: 0,          // Date.now() at the start of the current run segment
  elapsedBeforePause: 0,  // ms accumulated before the current segment
  preWarnFired: false,
  timeUpFired: false,
  overrunBeeps: 0,        // how many overrun repeats have already sounded
};

function elapsedMs() {
  if (timer.state === "running") {
    return timer.elapsedBeforePause + (Date.now() - timer.startEpoch);
  }
  return timer.elapsedBeforePause;
}

// ---- DOM refs -------------------------------------------------------------
const el = {
  body: document.body,
  label: document.getElementById("labelText"),
  status: document.getElementById("statusText"),
  clock: document.getElementById("clock"),
  bar: document.getElementById("barFill"),
  btnStart: document.getElementById("btnStart"),
  btnReset: document.getElementById("btnReset"),
  btnEnd: document.getElementById("btnEnd"),
  btnSetup: document.getElementById("btnSetup"),
  overlay: document.getElementById("overlay"),
};

// ---- Transport ------------------------------------------------------------
function start() {
  ensureAudio();                       // unlock audio on this user gesture
  if (timer.state === "running") return;
  if (timer.state === "idle" || timer.state === "ended") {
    timer.elapsedBeforePause = 0;
    timer.preWarnFired = false;
    timer.timeUpFired = false;
    timer.overrunBeeps = 0;
  }
  timer.startEpoch = Date.now();
  timer.state = "running";
  render();
}

function pause() {
  if (timer.state !== "running") return;
  timer.elapsedBeforePause += Date.now() - timer.startEpoch;
  timer.state = "paused";
  render();
}

function toggleStartPause() {
  if (timer.state === "running") pause();
  else start();                        // idle, paused, ended → run
}

function reset() {
  timer.state = "idle";
  timer.elapsedBeforePause = 0;
  timer.preWarnFired = false;
  timer.timeUpFired = false;
  timer.overrunBeeps = 0;
  render();
}

function end() {
  if (timer.state === "idle" || timer.state === "ended") return;
  if (timer.state === "running") {
    timer.elapsedBeforePause += Date.now() - timer.startEpoch;
  }
  timer.state = "ended";
  render();
}

// ---- Alert checking (only while actively running) -------------------------
function checkAlerts(elapsed) {
  if (timer.state !== "running") return;
  const remaining = config.durationMs - elapsed;

  // Pre-warning: at N seconds remaining (fires once)
  if (!timer.preWarnFired && remaining <= config.preWarn.n * 1000) {
    timer.preWarnFired = true;
    playSound(config.preWarn.sound);
  }
  // Time up: at zero (fires once)
  if (!timer.timeUpFired && elapsed >= config.durationMs) {
    timer.timeUpFired = true;
    playSound(config.timeUp.sound);
  }
  // Overrun repeat: every N seconds past zero
  if (elapsed > config.durationMs) {
    const overMs = elapsed - config.durationMs;
    const due = Math.floor(overMs / (config.overrun.n * 1000));
    if (due > timer.overrunBeeps) {
      timer.overrunBeeps = due;
      playSound(config.overrun.sound);
    }
  }
}

// ---- Rendering ------------------------------------------------------------
function fmt(ms) {
  const total = Math.floor(ms / 1000);
  const m = Math.floor(total / 60);
  const s = total % 60;
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

function phaseFor(remaining) {
  if (timer.state === "idle") return "idle";
  if (timer.state === "ended") return "ended";
  if (remaining <= 0) return "overrun";
  if (remaining <= config.preWarn.n * 1000) return "prewarn";
  return "running";
}

function statusLabel(phase) {
  if (timer.state === "paused") return "Paused";
  switch (phase) {
    case "idle": return "Ready";
    case "running": return "Running";
    case "prewarn": return "Wrap up";
    case "overrun": return "Overrun";
    case "ended": return "Ended";
  }
  return "";
}

function render() {
  const elapsed = elapsedMs();
  const remaining = config.durationMs - elapsed;
  const phase = phaseFor(remaining);

  el.body.dataset.phase = phase;
  el.body.dataset.paused = String(timer.state === "paused");

  // Numerals
  if (remaining >= 0) {
    el.clock.textContent = fmt(remaining);
  } else {
    el.clock.innerHTML = '<span class="sign">+</span>' + fmt(-remaining);
  }

  // Label + status
  el.label.textContent = config.label || "Timer";
  el.status.textContent = statusLabel(phase);

  // Depletion bar (anchored right; drains left→right, then red refills from right)
  let scale;
  if (remaining > 0) {
    scale = Math.max(0, Math.min(1, remaining / config.durationMs));
  } else {
    const overFrac = (-remaining) / config.durationMs;
    scale = Math.max(0, Math.min(1, overFrac));   // red grows from the right
  }
  el.bar.style.transform = "scaleX(" + scale + ")";

  // Controls
  el.btnStart.textContent = "";
  el.btnStart.append(
    timer.state === "running" ? "Pause" : (timer.state === "paused" ? "Resume" : "Start")
  );
  const key = document.createElement("span");
  key.className = "key";
  key.textContent = "Space";
  el.btnStart.append(key);

  el.btnReset.disabled = (timer.state === "idle");
  el.btnEnd.disabled = (timer.state === "idle" || timer.state === "ended");
}

// ---- Animation loop (display only; math comes from timestamps) ------------
function loop() {
  if (timer.state === "running") {
    checkAlerts(elapsedMs());
    render();
  }
  requestAnimationFrame(loop);
}

// ---- Setup overlay --------------------------------------------------------
function fillSoundSelect(sel, chosen) {
  sel.innerHTML = "";
  for (const id in SOUNDS) {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = SOUNDS[id].name;
    if (id === chosen) opt.selected = true;
    sel.append(opt);
  }
}

function openSetup() {
  const g = (id) => document.getElementById(id);
  g("fLabel").value = config.label;
  g("fMin").value = Math.floor(config.durationMs / 60000);
  g("fSec").value = Math.floor((config.durationMs % 60000) / 1000);
  g("fPreN").value = config.preWarn.n;
  g("fOverN").value = config.overrun.n;
  fillSoundSelect(g("fPreSound"), config.preWarn.sound);
  fillSoundSelect(g("fUpSound"), config.timeUp.sound);
  fillSoundSelect(g("fOverSound"), config.overrun.sound);
  el.overlay.classList.add("open");
  g("fLabel").focus();
}

function closeSetup() {
  el.overlay.classList.remove("open");
}

function saveSetup() {
  const g = (id) => document.getElementById(id);
  const min = Math.max(0, parseInt(g("fMin").value, 10) || 0);
  const sec = Math.min(59, Math.max(0, parseInt(g("fSec").value, 10) || 0));
  let durMs = (min * 60 + sec) * 1000;
  if (durMs <= 0) durMs = 1000;        // never a zero-length timer

  config.label = g("fLabel").value.trim() || "Timer";
  config.durationMs = durMs;
  config.preWarn.n = Math.max(1, parseInt(g("fPreN").value, 10) || 1);
  config.preWarn.sound = g("fPreSound").value;
  config.timeUp.sound = g("fUpSound").value;
  config.overrun.n = Math.max(1, parseInt(g("fOverN").value, 10) || 1);
  config.overrun.sound = g("fOverSound").value;

  closeSetup();
  reset();                             // apply new config from a clean idle
}

// Preview a sound when its dropdown changes
["fPreSound", "fUpSound", "fOverSound"].forEach((id) => {
  document.getElementById(id).addEventListener("change", (e) => playSound(e.target.value));
});

// ---- Wiring ---------------------------------------------------------------
el.btnStart.addEventListener("click", toggleStartPause);
el.btnReset.addEventListener("click", reset);
el.btnEnd.addEventListener("click", end);
el.btnSetup.addEventListener("click", openSetup);
document.getElementById("btnSave").addEventListener("click", saveSetup);
document.getElementById("btnCancel").addEventListener("click", closeSetup);

document.addEventListener("keydown", (e) => {
  // When the setup panel is open, let inputs behave normally (Esc closes).
  if (el.overlay.classList.contains("open")) {
    if (e.key === "Escape") { e.preventDefault(); closeSetup(); }
    return;
  }
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;

  switch (e.key) {
    case " ":
    case "Spacebar":
      e.preventDefault(); toggleStartPause(); break;
    case "r": case "R":
      e.preventDefault(); reset(); break;
    case "e": case "E":
      e.preventDefault(); end(); break;
    case "s": case "S":
      e.preventDefault(); openSetup(); break;
  }
});

// Close overlay by clicking the backdrop
el.overlay.addEventListener("mousedown", (e) => {
  if (e.target === el.overlay) closeSetup();
});

// ---- Go -------------------------------------------------------------------
render();
requestAnimationFrame(loop);
</script>
</body>
</html>
