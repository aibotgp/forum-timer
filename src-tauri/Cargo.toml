[package]
name = "forum-timer"
version = "3.2.4"
description = "A meeting timer that makes overrun visible to the whole room"
authors = ["Rohit Goyal"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Smaller, faster release binaries — the app is a webview wrapper, so there is
# nothing to gain from keeping debug symbols around.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
